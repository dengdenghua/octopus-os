Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
UnifiedKernelImageFormat=echo-os_%v+&c
KernelCommandLine=
        ro
        quiet
        console=tty1
        console=ttyS0,115200n8
        systemd.verity_root_options=panic-on-corruption
        systemd.show_status=yes
        systemd.journald.forward_to_console=yes

Locale=C.UTF-8
Keymap=us
Timezone=Asia/Shanghai
Hostname=echo-os
RootPassword=hashed:!
Autologin=no

[Build]
BuildSources=%D/../..:echo-os

[Validation]
Checksum=yes
Sign=no
SecureBoot=no

[Runtime]
VirtualMachineMonitor=qemu
Console=read-only
CPUs=4
RAM=4G
KVM=auto
Firmware=uefi
Ephemeral=yes
QemuArgs=-device virtio-vga
