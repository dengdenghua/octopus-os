# Self-contained Echo Recovery UKI. It boots without either installed root slot.
[Config]
MinimumVersion=25.3

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Mirror=https://deb.debian.org/debian
LocalMirror=https://snapshot.debian.org/archive/debian/20260825T000000Z

[Output]
Format=uki
OutputDirectory=%D/mkosi.output
ImageId=echo-recovery
ManifestFormat=json,changelog
CompressOutput=no
Seed=ff83cc9e-2e21-42f0-9688-878e03b11c01

[Content]
Packages=
        systemd
        systemd-boot
        systemd-ukify
        systemd-repart
        linux-image-amd64
        initramfs-tools
        bash
        coreutils
        util-linux
        mawk
        sed
        udev
        e2fsprogs
        dosfstools
        cryptsetup-bin
        systemd-cryptsetup
        openssl
        gdisk
        gnupg
        gpgv
        python3
        zstd
        kbd
        less
        nano
        pciutils
        usbutils
        debian-archive-keyring

WithRecommends=no
WithDocs=no
SourceDateEpoch=1787616000
MakeInitrd=yes
Autologin=yes
RootPassword=hashed:!
ExtraTrees=
        %D/../../deploy/recovery/echo-recovery:/usr/bin/echo-recovery
        %D/../../deploy/recovery/echo-recovery.service:/usr/lib/systemd/system/echo-recovery.service
        %D/../../deploy/recovery/echo_restore_transaction.py:/usr/lib/echo-os/echo-restore-transaction.py
        %D/../../deploy/recovery/repart.d:/usr/lib/echo-os/recovery-repart.d
        %D/../../deploy/installer/echo-os-installer:/usr/bin/echo-os-installer
        %D/../../deploy/installer/verify_install_bundle.py:/usr/lib/echo-os/verify-install-bundle.py
        %D/../../deploy/installer/verify_install_stream.py:/usr/lib/echo-os/verify-install-stream.py
        %D/../../deploy/installer/verify_public_keyring.py:/usr/lib/echo-os/verify-public-keyring.py
        %D/../../deploy/installer/repart.d:/usr/lib/echo-os/install-repart.d
        %D/../../deploy/update/verify-verity-set.py:/usr/lib/echo-os/verify-verity-set.py
        %D/../../deploy/data-protection/echo_data_protection.py:/usr/lib/echo-os/echo-data-protection
        %D/../image/os_source_identity.py:/usr/lib/echo-os/os-source-identity.py
        %D/../../deploy/system-health/echo-os-source-identity:/usr/lib/echo-os/echo-os-source-identity

Bootable=yes
UnifiedKernelImages=yes
KernelCommandLine=
        rw
        quiet
        rd.systemd.unit=multi-user.target
        systemd.unit=multi-user.target
        systemd.show_status=yes
        systemd.journald.forward_to_console=yes

Locale=C.UTF-8
Keymap=us
Timezone=Asia/Shanghai
Hostname=echo-recovery

[Validation]
Checksum=yes
Sign=no
SecureBoot=no

[Runtime]
VirtualMachineMonitor=qemu
Console=read-only
CPUs=2
RAM=2G
KVM=auto
Firmware=uefi
Ephemeral=yes
