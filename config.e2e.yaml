# Deterministic local configuration for the full-stack Playwright lane.
# This file is intentionally offline: it must never require a provider key,
# touch a developer account, or reuse the normal development data directory.
name: echo-e2e
version_compat: "0.2"

planner:
  type: static

budget:
  max_tokens: 5000
  max_usd: 0.05
  max_latency_ms: 120000

local_auth:
  enabled: false

tentacle:
  enabled: false

oct:
  enabled: false

enable_web_skills: false
journal_file: auto
journal_max_bytes: 1000000
