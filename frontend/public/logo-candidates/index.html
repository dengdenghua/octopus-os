<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Echo Agent OS Logo Candidates</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #eef4fb;
        color: #0f172a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 20% 10%,
            rgba(96, 165, 250, 0.2),
            transparent 28rem
          ),
          linear-gradient(135deg, #f8fafc, #e8f3ff 52%, #eefcf8);
      }
      main {
        box-sizing: border-box;
        width: min(1160px, calc(100% - 48px));
        margin: 0 auto;
        padding: 44px 0 56px;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: 0;
      }
      p {
        margin: 10px 0 0;
        color: #475569;
        line-height: 1.7;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }
      .candidate {
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 8px;
        padding: 18px;
        box-shadow: 0 16px 34px rgba(15, 23, 42, 0.08);
      }
      .preview {
        display: grid;
        place-items: center;
        aspect-ratio: 1;
        border-radius: 8px;
        background:
          linear-gradient(45deg, #f8fafc 25%, transparent 25%),
          linear-gradient(-45deg, #f8fafc 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #f8fafc 75%),
          linear-gradient(-45deg, transparent 75%, #f8fafc 75%);
        background-size: 22px 22px;
        background-position:
          0 0,
          0 11px,
          11px -11px,
          -11px 0;
        background-color: #e2e8f0;
      }
      img {
        width: min(148px, 70%);
        height: min(148px, 70%);
        display: block;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }
      .name {
        font-weight: 720;
      }
      code {
        border: 1px solid #dbeafe;
        border-radius: 6px;
        padding: 4px 7px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 12px;
      }
      @media (max-width: 640px) {
        main {
          width: min(100% - 28px, 1160px);
          padding-top: 28px;
        }
        header {
          display: block;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Echo Agent OS Logo Candidates</h1>
          <p>
            候选只用于视觉选择，当前线上头像没有被替换。告诉我编号即可继续细化或应用。
          </p>
        </div>
      </header>
      <section class="grid">
        <article class="candidate">
          <div class="preview">
            <img src="./01-orbit-core.svg" alt="Option 1" />
          </div>
          <div class="meta">
            <span class="name">01 Orbit Core</span><code>稳重 / AI OS</code>
          </div>
        </article>
        <article class="candidate">
          <div class="preview">
            <img src="./02-prism-o.svg" alt="Option 2" />
          </div>
          <div class="meta">
            <span class="name">02 Prism O</span><code>清爽 / SaaS</code>
          </div>
        </article>
        <article class="candidate">
          <div class="preview">
            <img src="./03-command-glyph.svg" alt="Option 3" />
          </div>
          <div class="meta">
            <span class="name">03 Command Glyph</span><code>专业 / 强识别</code>
          </div>
        </article>
        <article class="candidate">
          <div class="preview">
            <img src="./04-shield-agent.svg" alt="Option 4" />
          </div>
          <div class="meta">
            <span class="name">04 Shield Agent</span><code>安全 / 企业</code>
          </div>
        </article>
        <article class="candidate">
          <div class="preview">
            <img src="./05-flow-network.svg" alt="Option 5" />
          </div>
          <div class="meta">
            <span class="name">05 Flow Network</span><code>智能 / 多节点</code>
          </div>
        </article>
        <article class="candidate">
          <div class="preview">
            <img src="./06-minimal-ink.svg" alt="Option 6" />
          </div>
          <div class="meta">
            <span class="name">06 Minimal Ink</span><code>简洁 / 产品化</code>
          </div>
        </article>
        <article class="candidate">
          <div class="preview">
            <img src="./07-terminal-agent.svg" alt="Option 7" />
          </div>
          <div class="meta">
            <span class="name">07 Terminal Agent</span
            ><code>开发者 / 工具</code>
          </div>
        </article>
        <article class="candidate">
          <div class="preview">
            <img src="./08-compass-os.svg" alt="Option 8" />
          </div>
          <div class="meta">
            <span class="name">08 Compass OS</span><code>规划 / 监督</code>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
