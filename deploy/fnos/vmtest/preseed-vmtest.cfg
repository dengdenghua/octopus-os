### Echo OS · Stage A VM 验证预置
#
# 与正式 preseed.cfg(deploy/fnos/installer/preseed.cfg)的关系:
#   本文件是它的"机器相关答案已烤死"变体,专供 QEMU 直启内核验证。
#   正式版走 /cdrom/echo-os/echo-install TUI 问机器相关问题;
#   这里 TUI 已被 selftest.sh 独立验证,故直接烤入答案,提前到内核命令行。
#
# 与正式版的 5 处差异(其余逐行同源):
#   1. 无 early_command —— TUI 不进 VM 链路(已被 selftest 覆盖)
#   2. partman-auto/disk 烤死 /dev/vda;recipe 用 atomic(见差异 5)
#   3. 镜像源固定清华(VM 在国内网络)
#   4. locale 用 en_US.UTF-8(串口日志可读性;正式版 zh_CN)
#   5. 分区 recipe 用 atomic 而非 expert_recipe —— SeaBIOS(BIOS 启动)下
#      efi method 分区的行为不在本阶段验证范围,留给 Stage B 真 ISO
#
# late_command 与正式版逻辑一致,仅源路径 /cdrom/echo-os → /echo-vmtest
# (载荷由追加 initrd 段携带,机制见 tools/make_initrd_segment.py)。

# ── 地区与键盘(差异 4)────────────────────────────────────
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i localechooser/supported-locales multiselect en_US.UTF-8

# ── 网络:DHCP ────────────────────────────────────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string echo-vm
d-i netcfg/get_domain string local
d-i netcfg/hostname string echo-vm
d-i hw-detect/load_firmware boolean true

# ── 镜像源(差异 3)────────────────────────────────────────
d-i mirror/country string manual
d-i mirror/http/hostname string mirrors.tuna.tsinghua.edu.cn
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ── 分区(差异 2/5):QEMU virtio 盘,atomic 配方 ──────────
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select atomic
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ── 时钟 ──────────────────────────────────────────────────
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true

# ── 账号:测试口令烤入(仅 VM 验证用,不用于生产)──────────
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Echo Admin
d-i passwd/username string echo
d-i passwd/user-password password echo123
d-i passwd/user-password-again password echo123
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false
d-i passwd/root-login boolean false

# ── 软件包:与正式版同源 ──────────────────────────────────
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/enable-source-repositories boolean false
tasksel tasksel/first multiselect standard ssh-server
d-i pkgsel/include string \
  openssh-server sudo curl ca-certificates gnupg \
  python3 python3-venv python3-pip git \
  nginx smartmontools
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

# ── 引导:SeaBIOS,grub 装到 /dev/vda ─────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default
d-i finish-install/reboot_in_progress note
# VM 验证必开:否则装出的系统串口静音,无法无人值守确认引导结果
d-i debian-installer/add-kernel-opts string console=ttyS0,115200n8

# ── 装完:投放首次开机脚本(与正式版同逻辑,源路径不同)──
# 载荷在追加 initrd 段里,对安装器环境来说就是根目录下的 /echo-vmtest/。
d-i preseed/late_command string \
  in-target mkdir -p /opt/echo-os/deploy/fnos/base ; \
  cp /echo-vmtest/setup-base.sh /target/opt/echo-os/deploy/fnos/base/setup-base.sh ; \
  in-target chmod +x /opt/echo-os/deploy/fnos/base/setup-base.sh ; \
  cp /echo-vmtest/echo-firstboot.service /target/etc/systemd/system/echo-firstboot.service ; \
  in-target systemctl enable echo-firstboot.service ; \
  cp /echo-vmtest/99-echo-os /target/etc/sudoers.d/99-echo-os ; \
  in-target chmod 0440 /etc/sudoers.d/99-echo-os ; \
  in-target mkdir -p /data ; \
  echo stageA-ok > /target/var/log/echo-stageA.txt
