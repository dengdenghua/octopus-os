# Echo OS production TLS edge.
#
# Do not invoke this overlay directly. `./start-tls.sh` validates the
# certificate, derives the exact browser trust boundary and forces the
# backend's compatibility port onto 127.0.0.1 before Compose interpolation.

services:
  echo-os:
    environment:
      ECHO_APPLIANCE_TRUSTED_HOSTS: ${ECHO_APPLIANCE_TRUSTED_HOSTS:?start-tls.sh sets the exact TLS host}
      ECHO_APPLIANCE_TRUSTED_ORIGINS: ${ECHO_APPLIANCE_TRUSTED_ORIGINS:?start-tls.sh sets the exact HTTPS origin}
      FORWARDED_ALLOW_IPS: ${ECHO_TLS_PROXY_IP:-172.30.90.2}

  tls-gateway:
    image: nginx:1.28.0-alpine-slim@sha256:ce2bd4775ed6859d35f47d65401ee9f35f1dd00b32ed05f0ce38b68aa1830195
    container_name: echo-tls-gateway
    restart: unless-stopped
    ports:
      - "${ECHO_TLS_BIND_ADDRESS:-0.0.0.0}:${ECHO_TLS_HTTPS_PORT:-443}:8443"
      - "${ECHO_TLS_BIND_ADDRESS:-0.0.0.0}:${ECHO_TLS_HTTP_PORT:-80}:8080"
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/echo.crt:/etc/nginx/tls/echo.crt:ro
      - ./tls/echo.key:/etc/nginx/tls/echo.key:ro
    depends_on:
      echo-os:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${ECHO_TLS_PROXY_IP:-172.30.90.2}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "--quiet",
          "--spider",
          "https://127.0.0.1:8443/gateway-health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    ipam:
      config:
        - subnet: ${ECHO_TLS_SUBNET:-172.30.90.0/24}
