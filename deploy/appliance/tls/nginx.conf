worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Do not put query strings in access logs. Legacy WebSocket clients may
    # carry credentials in the query, and the backend is responsible for
    # redacting those during its compatibility window.
    log_format echo_safe '$remote_addr - $request_method $uri $server_protocol '
                         '$status $body_bytes_sent $request_time';
    access_log /dev/stdout echo_safe;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/tls/echo.crt;
        ssl_certificate_key /etc/nginx/tls/echo.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:echo_tls:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS is intentionally not enabled here. Private/self-managed CAs
        # should only opt into HSTS after every client trusts the certificate.
        location = /gateway-health {
            access_log off;
            return 204;
        }

        location / {
            proxy_pass http://echo-os:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Multi-GB upload/download, SSE and WebSocket streams must not be
            # collected into an edge-container buffer.
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;
        }
    }
}
