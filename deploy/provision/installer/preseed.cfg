### Echo OS · Debian Installer 静态预置
#
# 职责边界(重要):
#   本文件只放**静态策略** —— 那些与具体机器无关的选择:地区、镜像源、
#   分区方案、装什么包、装完跑什么。
#   与机器相关的选择(系统盘 / 主机名 / 管理员密码)由 echo-install 这个
#   TUI 在 d-i 启动前用 debconf-set-selections 写入运行时数据库。
#
#   两者合并后 d-i 全程无人值守。这个"静态 preseed + 运行时 debconf"的二分,
#   是参考 NAS安装器逆向里学到的:动态部分用自研 TUI 问,静态部分交给 preseed。
#
#   触发方式用 d-i 官方的 early_command —— 因此**完全不需要改 initrd**。
#   参考 NAS是把自研 TUI 塞进 initrd 并 patch debian-installer-startup 两行;
#   我们走官方钩子,装机镜像升级时不会因为 initrd 结构变化而失效。

# ── 装机 TUI(在 d-i 读取其余预置之前问清系统盘/主机名/密码)──
d-i preseed/early_command string /cdrom/echo-os/echo-install

# ── 地区与键盘 ────────────────────────────────────────────
d-i debian-installer/locale string zh_CN.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i localechooser/supported-locales multiselect zh_CN.UTF-8, en_US.UTF-8

# ── 网络:DHCP,主机名由 echo-install 覆盖 ──────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string echo
d-i netcfg/get_domain string local
d-i netcfg/hostname string echo
d-i hw-detect/load_firmware boolean true

# ── 镜像源 ────────────────────────────────────────────────
# 国内机器建议换成 mirrors.ustc.edu.cn / mirrors.tuna.tsinghua.edu.cn,
# build-iso.sh 支持用 --mirror 覆盖。
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ── 分区:整盘单分区 + EFI + swap ─────────────────────────
# 具体磁盘由 echo-install 写 partman-auto/disk。
# 系统盘只装系统;数据盘留空,装机后在桌面里组 ZFS 存储池 ——
# 与参考 NAS同一思路:系统与数据分离,重刷系统不动数据。
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string \
  echo :: \
    512 512 1024 fat32 \
      $primary{ } $bootable{ } \
      method{ efi } format{ } \
    . \
    2048 4096 8192 linux-swap \
      method{ swap } format{ } \
    . \
    30000 60000 -1 ext4 \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ / } \
    .
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ── 时钟 ──────────────────────────────────────────────────
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true

# ── 账号:密码由 echo-install 写入;这里只兜底 ──────────
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Echo Admin
d-i passwd/username string echo
# 密码由 echo-install 在当前 cdebconf 数据库中写入。不要再设置
# passwd/user-password-crypted：值 "!" 会锁定账户并覆盖 TUI 密码。
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false
# 不装 root 密码(锁 root,走 sudo)
d-i passwd/root-login boolean false

# ── 软件包:极简基座,其余交给 setup-base.sh ──────────────
# 关键取舍:不在 d-i 阶段装 ZFS / Docker / Electron —— 它们需要网络+时间,
# 且失败会让装机直接失败。d-i 只负责把 Debian 装上,剩下的放到首次开机
# 由 echo-firstboot.service 完成(可失败重试、可看日志)。
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/enable-source-repositories boolean false
tasksel tasksel/first multiselect standard ssh-server
d-i pkgsel/include string \
  openssh-server sudo curl ca-certificates gnupg \
  python3 python3-venv python3-pip git \
  nginx smartmontools
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

# ── 引导 ──────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default
d-i finish-install/reboot_in_progress note

# NAS 是 headless 设备,串口控制台是管理兜底(显示坏/无显示时唯一入口)。
# add-kernel-opts 会把参数带进目标系统 GRUB —— VM 验证时确认:不设它,
# 装出的系统串口在内核起完后就静音,只剩 GRUB 可见。
# 需要接显示器的桌面形态可注释掉这行。
d-i debian-installer/add-kernel-opts string console=ttyS0,115200n8

# ── 装完:投放首次开机脚本 ────────────────────────────────
# setup-base.sh 由 build-iso.sh 放在 ISO 根目录 /echo/ 下。Debian 13 d-i
# 通常把光盘挂到 /media/cdrom，兼容旧版 /cdrom；找不到完整载荷必须让
# late_command 失败，不能产出缺 firstboot 的半成品系统。
d-i preseed/late_command string \
  set -e ; \
  payload= ; \
  for candidate in /media/cdrom/echo /cdrom/echo /media/cdrom/echo-os /cdrom/echo-os ; do \
    if [ -f "$candidate/setup-base.sh" ]; then payload=$candidate ; break ; fi ; \
  done ; \
  if [ -z "$payload" ]; then echo "Echo OS ISO payload not found" >&2 ; exit 1 ; fi ; \
  in-target mkdir -p /opt/echo-os/deploy/provision/base /etc/echo-os ; \
  cp "$payload/echo-env.sh" /target/etc/echo-os/firstboot.env ; \
  in-target chmod 0644 /etc/echo-os/firstboot.env ; \
  cp "$payload/echo-source.bundle" /target/opt/echo-os-source.bundle ; \
  in-target chmod 0644 /opt/echo-os-source.bundle ; \
  if [ -f "$payload/echo-web-dist.tar.gz" ]; then cp "$payload/echo-web-dist.tar.gz" /target/opt/echo-web-dist.tar.gz ; in-target chmod 0644 /opt/echo-web-dist.tar.gz ; fi ; \
  if [ -f "$payload/echo-python-wheelhouse.tar.gz" ]; then cp "$payload/echo-python-wheelhouse.tar.gz" /target/opt/echo-python-wheelhouse.tar.gz ; in-target chmod 0644 /opt/echo-python-wheelhouse.tar.gz ; fi ; \
  if [ -f "$payload/echo-system-debs.tar.gz" ]; then cp "$payload/echo-system-debs.tar.gz" /target/opt/echo-system-debs.tar.gz ; in-target chmod 0644 /opt/echo-system-debs.tar.gz ; fi ; \
  cp "$payload/setup-base.sh" /target/opt/echo-os/deploy/provision/base/setup-base.sh ; \
  cp "$payload/provision-lib.sh" /target/opt/echo-os/deploy/provision/base/provision-lib.sh ; \
  in-target chmod +x /opt/echo-os/deploy/provision/base/setup-base.sh ; \
  cp "$payload/echo-firstboot.service" /target/etc/systemd/system/echo-firstboot.service ; \
  in-target systemctl enable echo-firstboot.service ; \
  cp "$payload/99-echo-os" /target/etc/sudoers.d/99-echo-os ; \
  in-target chmod 0440 /etc/sudoers.d/99-echo-os ; \
  in-target mkdir -p /data ; \
  if [ -f "$payload/echo-overlay.tar.gz" ]; then cp "$payload/echo-overlay.tar.gz" /target/opt/echo-os-overlay.tar.gz ; fi ; \
  echo stageA-ok > /target/var/log/echo-stageA.txt
