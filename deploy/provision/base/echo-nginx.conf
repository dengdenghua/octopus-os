# Echo OS · 对外唯一入口
#
# 与参考 NAS同一手法:单 nginx 暴露 80/443,后端功能模块各自监听本地端口或
# unix socket,不直接对外。好处是 TLS、压缩、上传限制、超时都只在一处配置。
#
# 差异:参考 NAS在这里放了 30 个 conf.d 片段(每个功能模块一个 unix socket);
# 我们把 appliance 作为单一后端,后续按模块拆分时再加 location 片段即可。

# WebSocket 升级头映射。sites-enabled 的文件被 include 进 http{} 内,
# 所以 map 可以直接放这里(放在 server{} 里会报 "map directive not allowed")。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream echo_appliance {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # 每设备独立自签证书(setup-base.sh 首启生成)。
    # 绝不随镜像分发固定私钥 —— 那是参考 NAS nginx conf 里的一个隐患。
    ssl_certificate     /etc/ssl/certs/echo-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/echo-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 上传大文件不截断(NAS 的核心场景)
    client_max_body_size 0;
    proxy_request_buffering off;

    # 静态前端:命中即直接返回,不打扰后端
    root /opt/echo-os/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ @backend;
    }

    # Agent 对话是长连接流式输出,超时必须放开
    location @backend {
        proxy_pass http://echo_appliance;
        proxy_http_version 1.1;
        # Preserve the browser-visible authority, including a non-default
        # port.  $host drops the port and makes localhost:8080 look like
        # 127.0.0.1:80 to the browser-boundary middleware.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host   $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket:Docker 终端、实时事件流
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # API 一律走后端,不走静态
    location /api/ {
        proxy_pass http://echo_appliance;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host   $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_buffering     off;
    }
}
