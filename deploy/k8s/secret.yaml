# Template only: replace every <CHANGE_ME> before applying. Keep secrets out
# of ConfigMaps and source control; production clusters should prefer an
# ExternalSecret or another managed secret store.
apiVersion: v1
kind: Secret
metadata:
  name: echo-agent-secrets
  namespace: echo-agent
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<CHANGE_ME>"
  TAVILY_API_KEY: "<CHANGE_ME>"
  # Embedded in redis:// URLs; generate URL-safe entropy: openssl rand -hex 32
  REDIS_PASSWORD: "<CHANGE_ME>"
  # Generate with: openssl rand -base64 48
  ECHO_LOCAL_AUTH_JWT_SECRET: "<CHANGE_ME>"
  # Generate with the documented hash_password command in deploy/k8s/README.md.
  # Store only the bcrypt hash here, never the administrator password.
  ECHO_ADMIN_PASSWORD_HASH: "<CHANGE_ME>"
  # Independent device-token key; generate with: openssl rand -hex 32
  ECHO_CLOUD_EDGE_TOKEN_SECRET: "<CHANGE_ME>"

