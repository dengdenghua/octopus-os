apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: echo-agent

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: echo-agent

