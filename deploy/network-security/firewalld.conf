# Echo OS firewalld policy. DefaultZone may be changed through the privileged
# KDE firewall KCM; every other value is a boot security invariant.
DefaultZone=echo-public
CleanupOnExit=no
CleanupModulesOnExit=no
IPv6_rpfilter=strict
IndividualCalls=no
LogDenied=off
FirewallBackend=nftables
FlushAllOnReload=yes
ReloadPolicy=INPUT:DROP,FORWARD:DROP,OUTPUT:DROP
RFC3964_IPv4=yes
StrictForwardPorts=yes
NftablesFlowtable=off
NftablesCounters=no
NftablesTableOwner=yes
