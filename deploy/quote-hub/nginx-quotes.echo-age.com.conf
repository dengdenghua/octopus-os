# Final dedicated public QuoteHub vhost.  Enable only after the independent
# quotes.echo-age.com certificate exists.  The internal official-origin bridge
# intentionally remains on api.echo-age.com and is not exposed here.

server {
    listen 80;
    listen [::]:80;
    server_name quotes.echo-age.com;
    server_tokens off;

    access_log /var/log/nginx/quotes.access.log quote_hub_noargs;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quotes.echo-age.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/quotes.echo-age.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quotes.echo-age.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/quotes.access.log quote_hub_noargs;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The account service validates the Echo Bearer token.  It receives no
    # body or stock-code query string, and QuoteHub never receives the token.
    location = /_quote_hub_account_auth {
        internal;
        proxy_pass http://127.0.0.1:8081/account/profile;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Status and snapshots share bounded short-request handling.  The anchored
    # regex exposes exactly these two paths and preserves the snapshot query.
    location ~ ^/api/plugins/paper-trading/quotes/(?:status|snapshot)$ {
        if ($quote_hub_origin_allowed = 0) { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET { deny all; }

        auth_request /_quote_hub_account_auth;
        limit_req zone=quote_hub_http_per_ip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "";
        proxy_set_header Cookie "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;

        add_header Access-Control-Allow-Origin $quote_hub_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Cache-Control, Last-Event-ID" always;
        add_header Access-Control-Max-Age "600" always;
        add_header Vary "Origin" always;
    }

    location = /api/plugins/paper-trading/quotes/stream {
        if ($quote_hub_origin_allowed = 0) { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET { deny all; }

        auth_request /_quote_hub_account_auth;
        limit_conn quote_hub_sse_per_ip 4;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "";
        proxy_set_header Cookie "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Accel-Buffering "no" always;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        send_timeout 660s;

        add_header Access-Control-Allow-Origin $quote_hub_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Cache-Control, Last-Event-ID" always;
        add_header Access-Control-Max-Age "600" always;
        add_header Vary "Origin" always;
    }

    # No health, readiness, account, proxy, UI, or official-origin path is
    # reachable through the dedicated quote hostname.
    location / {
        return 404;
    }
}
