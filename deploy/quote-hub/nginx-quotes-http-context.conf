# Install as /etc/nginx/conf.d/quote-hub-http-context.conf.  This file belongs
# in Nginx's `http` context, not inside a server block.

# Cross-origin browser access is deliberately limited to first-party Echo web
# origins.  Missing Origin is allowed for native apps and CLI clients, which
# must still pass Bearer authentication at the server location.
map $http_origin $quote_hub_cors_origin {
    default "";
    "" "";
    "https://echo-age.com" $http_origin;
    "https://ai.echo-age.com" $http_origin;
    "https://os.echo-age.com" $http_origin;
    "https://api.echo-age.com" $http_origin;
}

map $http_origin $quote_hub_origin_allowed {
    default 0;
    "" 1;
    "https://echo-age.com" 1;
    "https://ai.echo-age.com" 1;
    "https://os.echo-age.com" 1;
    "https://api.echo-age.com" 1;
}

# Bound one source IP before it can consume the service-wide 50-client limit.
limit_conn_zone $binary_remote_addr zone=quote_hub_sse_per_ip:10m;
limit_req_zone $binary_remote_addr zone=quote_hub_http_per_ip:10m rate=10r/s;

# Never put requested stock codes (the query string) in the public access log.
log_format quote_hub_noargs
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" rt=$request_time';
