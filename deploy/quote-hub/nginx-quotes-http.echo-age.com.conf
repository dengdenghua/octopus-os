# Safe pre-DNS/pre-certificate vhost.  Enable this first so the ACME webroot is
# ready when quotes.echo-age.com begins resolving.  Until TLS is installed all
# non-challenge traffic receives 404 instead of being sent to a wrong vhost.
server {
    listen 80;
    listen [::]:80;
    server_name quotes.echo-age.com;
    server_tokens off;

    access_log /var/log/nginx/quotes.access.log quote_hub_noargs;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
