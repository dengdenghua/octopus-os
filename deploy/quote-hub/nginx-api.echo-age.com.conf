# Include these locations inside the HTTPS `server` block for api.echo-age.com.
# Do not put them in the port-80 server: credentials and quote streams must only
# cross the public edge over TLS.

# Validate the caller with the existing account service. The response body is
# intentionally discarded; only a 2xx response permits access.
location = /_quote_hub_auth {
    internal;
    proxy_pass http://127.0.0.1:8081/account/profile;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    # Keep stock-code query strings out of the account-service access log.
    proxy_set_header X-Original-URI $uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SSE needs its own exact location so no inherited proxy/cache/gzip setting can
# batch events. Browser clients should use fetch streaming with a Bearer token.
location = /api/plugins/paper-trading/quotes/stream {
    auth_request /_quote_hub_auth;

    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-API-Key "";
    proxy_set_header Cookie "";
    proxy_set_header Proxy-Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Accel-Buffering "no" always;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
}

# Snapshot and status keep the original URI for compatibility with the bundled
# paper-trading UI. Authentication is completed before the request reaches the
# loopback-only QuoteHub process; caller credentials are not forwarded again.
location ^~ /api/plugins/paper-trading/quotes/ {
    auth_request /_quote_hub_auth;

    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-API-Key "";
    proxy_set_header Cookie "";
    proxy_set_header Proxy-Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
}

# Health is intentionally unavailable to public clients. It is useful for an
# on-host monitor without bypassing account auth for any quote data route.
location = /internal/quote-hub/readyz {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8091/readyz;
    proxy_set_header Host localhost;
}

# Restricted HTTPS bridge for the official REST origin. The trailing slashes
# are deliberate:
#   /internal/paper-origin/api/member/...
# becomes:
#   http://114.66.32.152:58868/api/member/...
location ^~ /internal/paper-origin/api/ {
    allow 127.0.0.1;
    allow ::1;
    allow 47.85.24.213;
    deny all;

    proxy_pass http://114.66.32.152:58868/api/;
    proxy_http_version 1.1;
    proxy_set_header Host 114.66.32.152:58868;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
}

# LivePush derives this path by removing the final `/api` from
# QUOTE_HUB_UPSTREAM_URL. Keep both location and proxy_pass trailing slashes so
# the Socket.IO query string and `/socket.io/` path arrive unchanged upstream.
location ^~ /internal/paper-origin/socket.io/ {
    allow 127.0.0.1;
    allow ::1;
    allow 47.85.24.213;
    deny all;

    proxy_pass http://114.66.32.152:58868/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Host 114.66.32.152:58868;
    # Present the legacy origin expected by the official Socket.IO server;
    # clients never see or connect to this cleartext hop directly.
    proxy_set_header Origin http://114.66.32.152:58868;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
