name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build signed and notarized macOS DMG
    runs-on: macos-15
    environment: macos-code-signing
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      ECHO_SOURCEMAP: "0"
      UV_PYTHON_DOWNLOADS: never
      CI: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate protected macOS signing and notarization identities
        env:
          CSC_LINK: ${{ secrets.MACOS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_NOTARIZATION_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!name:-}" || { echo "Protected secret $name is required" >&2; exit 1; }
          done
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key"
          chmod 0600 "$api_key"
          grep -q '^-----BEGIN PRIVATE KEY-----$' "$api_key"
          grep -q '^-----END PRIVATE KEY-----$' "$api_key"
          echo "APPLE_API_KEY=$api_key" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Setup pinned uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked desktop build dependencies
        run: >-
          uv sync --locked --python 3.11.9
          --extra desktop-core
          --extra desktop-build

      - name: Configure trusted first-party plugin publisher
        env:
          ECHO_PLUGIN_SIGNING_PUBLIC_KEY: ${{ vars.ECHO_PLUGIN_SIGNING_PUBLIC_KEY }}
          ECHO_PLUGIN_SIGNING_PUBLISHER_ID: ${{ vars.ECHO_PLUGIN_SIGNING_PUBLISHER_ID }}
          ECHO_PLUGIN_SIGNING_KEY_ID: ${{ vars.ECHO_PLUGIN_SIGNING_KEY_ID }}
        run: ./.venv/bin/python scripts/configure_builtin_plugin_publisher.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare pinned Codex macOS runtime
        working-directory: frontend
        run: pnpm codex:prepare:mac

      - name: Build backend with locked Python
        working-directory: extras/desktop
        env:
          PYTHON_EXE: ${{ github.workspace }}/.venv/bin/python
          ECHO_MAC_ARCH: arm64
        run: pnpm backend:build:mac

      - name: Verify native build inputs before packaging
        run: |
          set -euo pipefail
          backend="$PWD/extras/desktop/build/backend/echo-backend"
          codex="$PWD/extras/desktop/build/codex/bin/codex"
          for executable in "$backend" "$codex"; do
            test -x "$executable"
            file "$executable" | grep -Eq 'Mach-O .* arm64( |$)'
          done
          "$backend" --help >/dev/null
          "$codex" app-server --help >/dev/null

      - name: Sync locked desktop test dependencies
        run: >-
          uv sync --locked --python 3.11.9
          --extra dev
          --extra desktop-core
          --extra desktop-build

      - name: Verify desktop packaging contracts
        run: >-
          ./.venv/bin/python -m pytest
          tests/test_desktop_config_packaging.py
          tests/test_codex_upstream_update.py
          -q

      - name: Build signed and notarized Electron DMG
        working-directory: frontend
        env:
          CSC_LINK: ${{ secrets.MACOS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_API_ISSUER }}
        run: pnpm electron:build:mac

      - name: Verify packaged app, signing, notarization and first launch
        env:
          ECHO_REQUIRE_SIGNED_MACOS: "1"
          ECHO_MACOS_APP_LAUNCH_SMOKE: "1"
          ECHO_MAC_ARCH: arm64
        run: >-
          ./packaging/desktop/verify-packaged-macos.sh
          "$PWD/frontend/release/mac-arm64/Echo.app"

      - name: Bind DMG checksum to source revision
        working-directory: frontend/release
        run: |
          set -euo pipefail
          dmg=(Echo-Setup-macOS-*-${GITHUB_SHA}-arm64.dmg)
          zip=(Echo-Setup-macOS-*-${GITHUB_SHA}-arm64.zip)
          test "${#dmg[@]}" -eq 1
          test "${#zip[@]}" -eq 1
          update_assets=(
            "${dmg[0]}"
            "${dmg[0]}.blockmap"
            "${zip[0]}"
            "${zip[0]}.blockmap"
            latest-mac.yml
          )
          for asset in "${update_assets[@]}"; do test -s "$asset"; done
          version=$(node -p 'require("../package.json").version')
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/packaging/desktop/verify-electron-update-metadata.py" \
            --metadata latest-mac.yml \
            --asset-root . \
            --platform mac \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA"
          shasum -a 256 "${dmg[0]}" > SHA256SUMS-macOS
          shasum -a 256 "${update_assets[@]}" > UPDATE-SHA256SUMS-macOS
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg[0]}"
          mount_root=$(mktemp -d)
          trap 'hdiutil detach "$mount_root" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_root" "${dmg[0]}" >/dev/null
          test -d "$mount_root/Echo.app"
          codesign --verify --deep --strict --verbose=4 "$mount_root/Echo.app"
          test -x "$mount_root/Echo.app/Contents/Resources/backend/echo-backend"
          test -x "$mount_root/Echo.app/Contents/Resources/codex/bin/codex"
          ECHO_REQUIRE_SIGNED_MACOS=1 \
          ECHO_MACOS_APP_LAUNCH_SMOKE=1 \
          ECHO_MAC_ARCH=arm64 \
            "$GITHUB_WORKSPACE/packaging/desktop/verify-packaged-macos.sh" \
            "$mount_root/Echo.app"
          hdiutil detach "$mount_root" >/dev/null
          trap - EXIT
          cat SHA256SUMS-macOS
          cat UPDATE-SHA256SUMS-macOS

      - name: Attest canonical installer provenance
        id: installer-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            frontend/release/Echo-Setup-macOS-*.dmg
            frontend/release/Echo-Setup-macOS-*.dmg.blockmap
            frontend/release/Echo-Setup-macOS-*.zip
            frontend/release/Echo-Setup-macOS-*.zip.blockmap
            frontend/release/latest-mac.yml

      - name: Retain installer provenance bundle
        run: >-
          cp "${{ steps.installer-provenance.outputs.bundle-path }}"
          frontend/release/Echo-Setup-macOS-provenance.sigstore.json

      - name: Upload signed macOS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Echo-Setup-macOS-${{ github.sha }}
          path: |
            frontend/release/Echo-Setup-macOS-*.dmg
            frontend/release/Echo-Setup-macOS-*.dmg.blockmap
            frontend/release/Echo-Setup-macOS-*.zip
            frontend/release/Echo-Setup-macOS-*.zip.blockmap
            frontend/release/latest-mac.yml
            frontend/release/SHA256SUMS-macOS
            frontend/release/UPDATE-SHA256SUMS-macOS
            frontend/release/Echo-Setup-macOS-provenance.sigstore.json
          if-no-files-found: error
          retention-days: 30
