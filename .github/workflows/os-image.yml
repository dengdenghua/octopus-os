name: Echo OS image

on:
  workflow_dispatch:
  pull_request:
    branches: [os-main, main]
    paths:
      - ".github/workflows/os-image.yml"
      - "packaging/image/**"
      - "packaging/recovery/**"
      - "packaging/desktop/**"
      - "appliance/**"
      - "deploy/agent/**"
      - "deploy/backup/**"
      - "deploy/appliance/**"
      - "deploy/desktop-session/**"
      - "deploy/apps/**"
      - "deploy/machine-state/**"
      - "deploy/network-security/**"
      - "deploy/removable-storage/**"
      - "deploy/printing/**"
      - "deploy/scanning/**"
      - "deploy/core-apps/**"
      - "deploy/oem/**"
      - "deploy/update/**"
      - "deploy/recovery/**"
      - "deploy/installer/**"
      - "deploy/data-protection/**"
      - "frontend/electron/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/src/**"
      - "pyproject.toml"
  push:
    branches: [os-main, main]
    paths:
      - ".github/workflows/os-image.yml"
      - "packaging/image/**"
      - "packaging/recovery/**"
      - "packaging/desktop/**"
      - "appliance/**"
      - "deploy/agent/**"
      - "deploy/backup/**"
      - "deploy/appliance/**"
      - "deploy/desktop-session/**"
      - "deploy/apps/**"
      - "deploy/machine-state/**"
      - "deploy/network-security/**"
      - "deploy/removable-storage/**"
      - "deploy/printing/**"
      - "deploy/scanning/**"
      - "deploy/core-apps/**"
      - "deploy/oem/**"
      - "deploy/update/**"
      - "deploy/recovery/**"
      - "deploy/installer/**"
      - "deploy/data-protection/**"
      - "frontend/electron/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/src/**"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: echo-os-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Image source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:trixie-slim

    steps:
      - name: Install source-contract dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight the unified Echo source
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/os-main' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 deploy/appliance/delivery_source_preflight.py --compact

      - name: Verify runner policy and image source contract
        run: |
          python3 packaging/image/test_cleanup_linux_image_runner.py
          python3 packaging/image/test_verify_linux_image_runner_host.py
          python3 packaging/image/test_verify_linux_image_runner.py
          python3 packaging/image/test_verify_os_image_evidence.py
          ./packaging/image/verify-image.sh --static

  build-and-boot:
    name: Dedicated Linux x86 · GPT/UEFI cold boot
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/os-main' || github.ref == 'refs/heads/main')
    needs: source-contract
    runs-on: [self-hosted, linux, x64, echo-os-image]
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    container:
      image: debian:trixie-slim
      options: --privileged --volume /lib/modules:/lib/modules:ro

    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      TMPDIR: /__w/_temp

    steps:
      - name: Install image, VM and frontend build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file python3 debian-archive-keyring \
            mkosi systemd-container systemd-boot-efi systemd-repart systemd-ukify \
            qemu-system-x86 ovmf dosfstools mtools e2fsprogs fdisk gdisk zstd \
            gnupg gpgv initramfs-tools-core kmod openssl qemu-utils sbsigntool udev util-linux \
            python3-virt-firmware cryptsetup-bin dmsetup systemd-cryptsetup \
            swtpm swtpm-tools tpm2-tools libtss2-tcti-swtpm0t64

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight dedicated Linux image runner
        run: |
          modprobe loop max_loop=64
          modprobe nbd nbds_max=16 max_part=16
          udevadm settle --timeout=30
          python3 packaging/image/verify-linux-image-runner.py \
            --workspace "$GITHUB_WORKSPACE" \
            --scratch "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/echo-image-runner.json" \
            2>&1 | tee "$RUNNER_TEMP/echo-image-runner-preflight.log"

      - name: Record the clean Echo OS source identity
        run: |
          os_source_manifest="$RUNNER_TEMP/echo-os-source-identity.json"
          python3 packaging/image/os_source_identity.py capture \
            --repo "$PWD" \
            --expected-commit "$GITHUB_SHA" \
            --output "$os_source_manifest"
          echo "ECHO_OS_SOURCE_MANIFEST=$os_source_manifest" >>"$GITHUB_ENV"

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.26.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.25"

      - name: Prepare the unified Echo runtime bundle
        run: ./deploy/appliance/prepare-agent-bundle.sh

      - name: Create isolated CI Secure Boot and PCR policy identities
        run: |
          secure_boot_dir="$(mktemp -d "$RUNNER_TEMP/echo-secure-boot.XXXXXX")"
          secure_boot_key="$secure_boot_dir/db.key"
          secure_boot_certificate="$secure_boot_dir/db.crt"
          pcr_policy_key="$secure_boot_dir/pcr-policy.key"
          pcr_policy_certificate="$secure_boot_dir/pcr-policy.crt"
          pcr_policy_public_key="$secure_boot_dir/pcr-policy-public.pem"
          openssl req -new -x509 -newkey rsa:3072 -sha256 -nodes -days 1 \
            -subj "/CN=Echo OS isolated CI Secure Boot/" \
            -keyout "$secure_boot_key" \
            -out "$secure_boot_certificate"
          openssl req -new -x509 -newkey rsa:3072 -sha256 -nodes -days 1 \
            -subj "/CN=Echo OS isolated CI PCR policy/" \
            -keyout "$pcr_policy_key" \
            -out "$pcr_policy_certificate"
          openssl pkey -in "$pcr_policy_key" -pubout \
            -out "$pcr_policy_public_key"
          chmod 0600 "$secure_boot_key" "$pcr_policy_key"
          chmod 0644 "$secure_boot_certificate" "$pcr_policy_certificate" \
            "$pcr_policy_public_key"
          echo "ECHO_SECURE_BOOT_KEY=$secure_boot_key" >>"$GITHUB_ENV"
          echo "ECHO_SECURE_BOOT_CERTIFICATE=$secure_boot_certificate" >>"$GITHUB_ENV"
          echo "ECHO_PCR_POLICY_KEY=$pcr_policy_key" >>"$GITHUB_ENV"
          echo "ECHO_PCR_POLICY_CERTIFICATE=$pcr_policy_certificate" >>"$GITHUB_ENV"
          echo "ECHO_TPM2_PCR_PUBLIC_KEY=$pcr_policy_public_key" >>"$GITHUB_ENV"

      - name: Create an isolated CI installer trust identity
        run: |
          install_gnupg_home="$(mktemp -d "$RUNNER_TEMP/echo-install-gnupg.XXXXXX")"
          install_keyring="$RUNNER_TEMP/echo-install-keyring.gpg"
          chmod 0700 "$install_gnupg_home"
          GNUPGHOME="$install_gnupg_home" gpg --batch --passphrase "" \
            --quick-generate-key \
            "Echo OS isolated CI installer <ci-installer@example.invalid>" \
            ed25519 sign 1d
          install_fingerprint="$(
            GNUPGHOME="$install_gnupg_home" gpg --batch --with-colons \
              --list-secret-keys |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test -n "$install_fingerprint"
          GNUPGHOME="$install_gnupg_home" gpg --batch \
            --export "$install_fingerprint" >"$install_keyring"
          chmod 0644 "$install_keyring"
          echo "GNUPGHOME=$install_gnupg_home" >>"$GITHUB_ENV"
          echo "ECHO_INSTALL_KEYRING=$install_keyring" >>"$GITHUB_ENV"
          echo "ECHO_INSTALL_SIGNING_KEY=$install_fingerprint" >>"$GITHUB_ENV"

      - name: Create an isolated CI update trust identity
        run: |
          update_gnupg_home="$(mktemp -d "$RUNNER_TEMP/echo-update-gnupg.XXXXXX")"
          update_keyring="$RUNNER_TEMP/echo-update-keyring.gpg"
          chmod 0700 "$update_gnupg_home"
          GNUPGHOME="$update_gnupg_home" gpg --batch --passphrase "" \
            --quick-generate-key \
            "Echo OS isolated CI update <ci-update@example.invalid>" \
            ed25519 sign 1d
          update_fingerprint="$(
            GNUPGHOME="$update_gnupg_home" gpg --batch --with-colons \
              --list-secret-keys |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test -n "$update_fingerprint"
          GNUPGHOME="$update_gnupg_home" gpg --batch \
            --export "$update_fingerprint" >"$update_keyring"
          chmod 0644 "$update_keyring"
          echo "ECHO_UPDATE_KEYRING=$update_keyring" >>"$GITHUB_ENV"
          echo "ECHO_UPDATE_TRUST_GENERATION=1" >>"$GITHUB_ENV"

      - name: Create an isolated factory key for blank mutable data
        run: |
          factory_data_key="$RUNNER_TEMP/echo-factory-data.key"
          openssl rand -hex 32 | tr -d '\n' >"$factory_data_key"
          chmod 0600 "$factory_data_key"
          echo "ECHO_FACTORY_DATA_KEY=$factory_data_key" >>"$GITHUB_ENV"

      - name: Create one persistent virtual TPM identity for install and boot
        run: |
          swtpm_state="$RUNNER_TEMP/echo-swtpm-state"
          swtpm_srk="$RUNNER_TEMP/echo-swtpm-srk.tpm2b-public"
          recovery_key="$RUNNER_TEMP/echo-installed-recovery.key"
          mkdir -m 0700 "$swtpm_state"
          ./deploy/data-protection/echo-swtpm-ci initialize \
            "$swtpm_state" "$swtpm_srk"
          echo "ECHO_SWTPM_STATE_DIR=$swtpm_state" >>"$GITHUB_ENV"
          echo "ECHO_INSTALL_TPM2_DEVICE_KEY=$swtpm_srk" >>"$GITHUB_ENV"
          echo "ECHO_INSTALL_RECOVERY_KEY_OUTPUT=$recovery_key" >>"$GITHUB_ENV"
          echo "ECHO_DATA_RECOVERY_KEY=$recovery_key" >>"$GITHUB_ENV"

      - name: Create an isolated replacement TPM identity
        run: |
          replacement_swtpm_state="$RUNNER_TEMP/echo-replacement-swtpm-state"
          replacement_swtpm_srk="$RUNNER_TEMP/echo-replacement-swtpm-srk.tpm2b-public"
          mkdir -m 0700 "$replacement_swtpm_state"
          ./deploy/data-protection/echo-swtpm-ci initialize \
            "$replacement_swtpm_state" "$replacement_swtpm_srk"
          if cmp -s "$ECHO_INSTALL_TPM2_DEVICE_KEY" "$replacement_swtpm_srk"; then
            echo "replacement TPM unexpectedly exported the original SRK" >&2
            exit 1
          fi
          echo "ECHO_REPLACEMENT_SWTPM_STATE_DIR=$replacement_swtpm_state" >>"$GITHUB_ENV"
          echo "ECHO_REPLACEMENT_TPM2_DEVICE_KEY=$replacement_swtpm_srk" >>"$GITHUB_ENV"

      - name: Verify one-time local-account policy
        run: |
          python3 deploy/oem/test_echo_oem_setup.py
          python3 deploy/oem/test_echo_sddm_accessibility.py
          python3 packaging/image/test_send_sddm_screen_reader_key.py

      - name: Verify encrypted user-backup and restore-transaction policy
        run: python3 deploy/backup/test_echo_user_backup.py

      - name: Verify persistent application-catalog policy
        run: ./deploy/apps/test-echo-app-catalog.sh

      - name: Verify persistent machine-identity policy
        run: ./deploy/machine-state/test-echo-machine-id.sh

      - name: Verify persistent NetworkManager-state policy
        run: ./deploy/machine-state/test-echo-network-state.sh

      - name: Verify nftables/firewalld host-firewall policy
        run: |
          python3 deploy/network-security/test_echo_firewall_policy.py
          python3 deploy/network-security/test_echo_firewall_health.py

      - name: Verify on-demand removable-storage policy
        run: python3 deploy/removable-storage/test_echo_removable_storage_health.py

      - name: Verify private local printing policy
        run: |
          python3 deploy/printing/test_echo_printing_policy.py
          python3 deploy/printing/test_echo_printing_health.py

      - name: Verify native scanning policy
        run: |
          python3 deploy/scanning/test_echo_scanning_policy.py
          python3 deploy/scanning/test_echo_scanning_health.py

      - name: Verify core desktop application defaults
        run: |
          python3 deploy/core-apps/test_echo_core_apps_policy.py
          python3 deploy/core-apps/test_echo_core_apps_health.py
          python3 deploy/core-apps/test_echo_core_apps_session_smoke.py

      - name: Verify persistent regional-state policy
        run: python3 deploy/machine-state/test_echo_region_state.py

      - name: Verify PAM screen-lock policy
        run: ./deploy/desktop-session/test-echo-session-lock.sh

      - name: Verify compositor-native KWin bridge protocol
        run: python3 deploy/desktop-session/test_echo_kwin_window_bridge.py

      - name: Verify authenticated installer bundle policy
        run: |
          python3 deploy/installer/test_verify_install_bundle.py
          python3 deploy/installer/test_verify_install_stream.py
          python3 deploy/installer/test_verify_public_keyring.py

      - name: Verify authenticated update bundle policy
        run: |
          python3 -m unittest discover -s deploy/update -p '*test*.py' -v
          node frontend/electron/system-update.test.cjs
          ./deploy/update/test-echo-os-update.sh
          ./deploy/update/test-echo-os-update-channel.sh
          ./deploy/update/smoke-update-trust-rotation.sh
          ./deploy/update/smoke-update-repository-publication.sh

      - name: Verify per-device data-protection enrollment policy
        run: |
          python3 deploy/data-protection/test_echo_data_protection.py
          python3 deploy/data-protection/test_verify_uki_pcr_policy.py

      - name: Verify crash-recoverable staged-restore promotion policy
        run: python3 deploy/recovery/test_echo_restore_transaction.py

      - name: Verify resolved mkosi release-policy gate
        run: |
          python3 deploy/appliance/test_unified_echo_workflow_policy.py
          python3 packaging/image/test_os_source_identity.py
          ./deploy/system-health/test-echo-os-source-identity.sh
          ./deploy/oem/test-verify-login-boot.sh
          ./deploy/recovery/test-echo-recovery-source-identity.sh
          python3 packaging/image/test_verify_mkosi_summary.py
          python3 packaging/image/test_interrupt_sysupdate_after_write.py
          python3 packaging/image/test_verify_agent_recovery_fixture.py
          python3 packaging/image/test_verify_os_image_evidence.py

      - name: Build and verify GPT/UEFI image
        run: ./packaging/image/build-image.sh

      - name: Create the authenticated installer bundle
        run: >-
          ./deploy/installer/create-install-bundle.sh
          packaging/image/mkosi.output/install-bundle

      - name: Install onto an ephemeral whole disk
        run: |
          ./deploy/installer/smoke-installer-install.sh \
            packaging/image/mkosi.output/install-bundle \
            "$ECHO_INSTALL_KEYRING" \
            "$RUNNER_TEMP/echo-os-installed.raw" \
            2>&1 | tee "$RUNNER_TEMP/echo-installer-install.log"

      - name: Secure-Boot Recovery from the installed disk
        env:
          ECHO_RECOVERY_LOG_DIR: ${{ runner.temp }}/echo-recovery-boot
        run: >-
          ./packaging/image/smoke-recovery-image.sh
          "$RUNNER_TEMP/echo-os-installed.raw"

      - name: Rotate recovery access and bind a replacement TPM
        run: |
          ./packaging/image/smoke-key-lifecycle.sh \
            "$RUNNER_TEMP/echo-os-installed.raw" \
            "$RUNNER_TEMP/echo-os-replacement-tpm.raw" \
            "$RUNNER_TEMP/echo-rotated-recovery.key" \
            "$ECHO_REPLACEMENT_TPM2_DEVICE_KEY" \
            2>&1 | tee "$RUNNER_TEMP/echo-key-lifecycle.log"

      - name: Secure-Boot with the replacement TPM identity
        run: |
          ECHO_SWTPM_STATE_DIR="$ECHO_REPLACEMENT_SWTPM_STATE_DIR" \
          ECHO_BOOT_LOG_DIR="$RUNNER_TEMP/echo-replacement-tpm-boot" \
            ./packaging/image/smoke-boot-image.sh \
              "$RUNNER_TEMP/echo-os-replacement-tpm.raw"

      - name: Release the verified replacement-TPM disk branch
        run: rm -- "$RUNNER_TEMP/echo-os-replacement-tpm.raw"

      - name: Factory-reset a disposable copy of the installed disk
        run: |
          ./packaging/image/smoke-factory-reset.sh \
            "$RUNNER_TEMP/echo-os-installed.raw" \
            "$RUNNER_TEMP/echo-os-factory-reset.raw" \
            "$RUNNER_TEMP/echo-factory-reset-recovery.key" \
            2>&1 | tee "$RUNNER_TEMP/echo-factory-reset.log"

      - name: Secure-Boot the reset disk with its rotated TPM identity
        env:
          ECHO_BOOT_LOG_DIR: ${{ runner.temp }}/echo-factory-reset-boot
        run: >-
          ./packaging/image/smoke-boot-image.sh
          "$RUNNER_TEMP/echo-os-factory-reset.raw"

      - name: Release the verified factory-reset disk branch
        run: rm -- "$RUNNER_TEMP/echo-os-factory-reset.raw"

      - name: Secure-Boot OEM first-use from the installed disk
        env:
          ECHO_LOGIN_LOG_DIR: ${{ runner.temp }}/echo-oem-login-boot
        run: >-
          ./packaging/image/smoke-oem-image.sh
          "$RUNNER_TEMP/echo-os-installed.raw"
          "$RUNNER_TEMP/echo-os-provisioned.raw"

      - name: Secure-Boot the accessible production SDDM greeter
        env:
          ECHO_SDDM_ACCESSIBILITY_LOG_DIR: ${{ runner.temp }}/echo-sddm-accessibility-boot
        run: >-
          ./packaging/image/smoke-sddm-accessibility-image.sh
          "$RUNNER_TEMP/echo-os-provisioned.raw"

      - name: Encrypted backup plus Recovery promotion, rollback and commit
        env:
          ECHO_USER_BACKUP_LOG_DIR: ${{ runner.temp }}/echo-user-backup-boot
        run: >-
          ./packaging/image/smoke-user-backup-image.sh
          "$RUNNER_TEMP/echo-os-provisioned.raw"

      - name: Release the verified provisioned disk branch
        run: rm -- "$RUNNER_TEMP/echo-os-provisioned.raw"

      - name: Secure-Boot production SDDM from the installed disk
        env:
          ECHO_LOGIN_LOG_DIR: ${{ runner.temp }}/echo-login-boot
        run: >-
          ./packaging/image/smoke-login-image.sh
          "$RUNNER_TEMP/echo-os-installed.raw"

      - name: Secure-Boot the Wayland candidate from the installed disk
        env:
          ECHO_LOGIN_SESSION: echo-wayland.desktop
          ECHO_LOGIN_LOG_DIR: ${{ runner.temp }}/echo-wayland-login-boot
          ECHO_LOGIN_TIMEOUT_SECONDS: "240"
        run: >-
          ./packaging/image/smoke-login-image.sh
          "$RUNNER_TEMP/echo-os-installed.raw"

      - name: Secure-Boot the direct desktop from the installed disk
        env:
          ECHO_BOOT_LOG_DIR: ${{ runner.temp }}/echo-os-boot
        run: >-
          ./packaging/image/smoke-boot-image.sh
          "$RUNNER_TEMP/echo-os-installed.raw"

      - name: Secure-Boot discovers interrupted Agent work without executing it
        env:
          ECHO_AGENT_RECOVERY_LOG_DIR: ${{ runner.temp }}/echo-agent-recovery-boot
        run: >-
          ./packaging/image/smoke-agent-recovery-image.sh
          "$RUNNER_TEMP/echo-os-installed.raw"

      - name: Bind all install and cold-boot evidence to one manifest
        run: >-
          python3 packaging/image/verify-os-image-evidence.py
          --image-version "$(tr -d '[:space:]' < packaging/image/mkosi.version)"
          --os-source-manifest "$ECHO_OS_SOURCE_MANIFEST"
          --agent-manifest "$PWD/packaging/image/mkosi.agent-runtime/opt/echo-agent/agent-bundle.json"
          --install-manifest "$PWD/packaging/image/mkosi.output/install-bundle/INSTALL-MANIFEST.json"
          --install-signature "$PWD/packaging/image/mkosi.output/install-bundle/INSTALL-MANIFEST.json.gpg"
          --install-keyring "$ECHO_INSTALL_KEYRING"
          --secure-boot-certificate "$ECHO_SECURE_BOOT_CERTIFICATE"
          --pcr-policy-public-key "$ECHO_TPM2_PCR_PUBLIC_KEY"
          --installed-image "$RUNNER_TEMP/echo-os-installed.raw"
          --logs-root "$RUNNER_TEMP"
          --output "$RUNNER_TEMP/echo-os-image-evidence.json"

      - name: Sign and verify the unified image evidence
        run: |
          ./packaging/image/sign-os-image-evidence.sh \
            "$RUNNER_TEMP/echo-os-image-evidence.json" \
            "$RUNNER_TEMP/echo-os-image-evidence.json.gpg" \
            "$ECHO_INSTALL_KEYRING" \
            "$ECHO_INSTALL_SIGNING_KEY" \
            2>&1 | tee "$RUNNER_TEMP/echo-os-image-evidence-signing.log"

      - name: Attest the signed raw-image evidence identity
        if: >-
          success() && github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/os-main' || github.ref == 'refs/heads/main')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/echo-os-image-evidence.json
            ${{ runner.temp }}/echo-os-image-evidence.json.gpg
            ${{ runner.temp }}/echo-install-keyring.gpg

      - name: Upload the signed raw-image release evidence
        if: >-
          success() && github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/os-main' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: echo-os-x86-64-release-evidence
          path: |
            ${{ runner.temp }}/echo-os-image-evidence.json
            ${{ runner.temp }}/echo-os-image-evidence.json.gpg
            ${{ runner.temp }}/echo-install-keyring.gpg
          if-no-files-found: error
          retention-days: 30

      - name: Upload image, UKI, checksums, manifests and boot log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: echo-os-x86-64-uefi
          path: |
            packaging/image/mkosi.output/install-bundle/**
            packaging/image/mkosi.output/*.efi
            packaging/image/mkosi.output/*SHA256SUMS
            packaging/image/mkosi.output/*.manifest
            packaging/image/mkosi.output/*.changelog
            packaging/recovery/mkosi.output/*.efi
            packaging/recovery/mkosi.output/*SHA256SUMS
            packaging/recovery/mkosi.output/*.manifest
            packaging/recovery/mkosi.output/*.changelog
            ${{ runner.temp }}/echo-os-boot
            ${{ runner.temp }}/echo-agent-recovery-boot
            ${{ runner.temp }}/echo-recovery-boot
            ${{ runner.temp }}/echo-replacement-tpm-boot
            ${{ runner.temp }}/echo-factory-reset-boot
            ${{ runner.temp }}/echo-oem-login-boot
            ${{ runner.temp }}/echo-sddm-accessibility-boot
            ${{ runner.temp }}/echo-user-backup-boot
            ${{ runner.temp }}/echo-login-boot
            ${{ runner.temp }}/echo-wayland-login-boot
            ${{ runner.temp }}/echo-installer-install.log
            ${{ runner.temp }}/echo-image-runner.json
            ${{ runner.temp }}/echo-image-runner-preflight.log
            ${{ runner.temp }}/echo-key-lifecycle.log
            ${{ runner.temp }}/echo-factory-reset.log
            ${{ runner.temp }}/echo-install-keyring.gpg
            ${{ env.ECHO_SECURE_BOOT_CERTIFICATE }}
            ${{ env.ECHO_TPM2_PCR_PUBLIC_KEY }}
            ${{ runner.temp }}/echo-os-source-identity.json
            ${{ runner.temp }}/echo-os-image-evidence.json
            ${{ runner.temp }}/echo-os-image-evidence.json.gpg
            ${{ runner.temp }}/echo-os-image-evidence-signing.log
          if-no-files-found: warn
          retention-days: 30

      - name: Remove generated bundle and whole-disk temporaries
        if: always()
        run: >-
          python3 packaging/image/cleanup-linux-image-runner.py
          --workspace "$GITHUB_WORKSPACE"
          --scratch "$RUNNER_TEMP"
