name: Behavioral surpass evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: behavioral-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  behavioral-evidence:
    name: Same-SHA Echo vs Codex Desktop evidence
    runs-on: [self-hosted, macOS, behavioral-evidence]
    # Required reviewers and the fixed identity vars/secrets are configured on
    # this environment. A missing variable fails closed in the preflight below.
    environment: behavioral-evidence
    timeout-minutes: 720
    env:
      ECHO_BEHAVIORAL_EXPECTED_REVISION: ${{ github.sha }}
      ECHO_EVAL_CONFIG: ${{ vars.ECHO_BEHAVIORAL_CONFIG_PATH }}
      ECHO_EVAL_LOCAL_USERNAME: ${{ vars.ECHO_BEHAVIORAL_LOCAL_USERNAME }}
      ECHO_EVAL_ECHO_MODEL: ${{ vars.ECHO_BEHAVIORAL_ECHO_MODEL }}
      ECHO_EVAL_CODEX_MODEL: ${{ vars.ECHO_BEHAVIORAL_CODEX_MODEL }}
      ECHO_EVAL_EXPECTED_CONFIG_SHA256: ${{ vars.ECHO_BEHAVIORAL_CONFIG_SHA256 }}
      ECHO_EVAL_EXPECTED_CODEX_SHA256: ${{ vars.ECHO_BEHAVIORAL_CODEX_SHA256 }}
      ECHO_EVAL_EXPECTED_CODEX_TEAM_ID: ${{ vars.ECHO_BEHAVIORAL_CODEX_TEAM_ID }}
      ECHO_EVAL_EXPECTED_CODEX_IDENTIFIER: ${{ vars.ECHO_BEHAVIORAL_CODEX_IDENTIFIER }}
      ECHO_CODEX_EXECUTABLE: /Applications/ChatGPT.app/Contents/Resources/codex
      ECHO_HOME: ${{ runner.temp }}/echo-behavioral-${{ github.run_id }}-${{ github.run_attempt }}
      ECHO_DATA_DIR: ${{ runner.temp }}/echo-behavioral-${{ github.run_id }}-${{ github.run_attempt }}/data
      ECHO_EVAL_SERVER_LOG: ${{ runner.temp }}/echo-behavioral-${{ github.run_id }}-${{ github.run_attempt }}/server.log
      UV_PYTHON_DOWNLOADS: never

    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked evaluation dependencies
        run: uv sync --locked --python 3.11.9 --extra dev --extra serve --extra web

      - name: Verify protected behavioral identities
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          if [[ "${actual_revision}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checkout revision ${actual_revision} does not match ${GITHUB_SHA}."
            exit 1
          fi
          if [[ "${ECHO_EVAL_CONFIG}" != /* || ! -f "${ECHO_EVAL_CONFIG}" ]]; then
            echo "::error::Protected ECHO_BEHAVIORAL_CONFIG_PATH must be an absolute existing file."
            exit 1
          fi
          required_values=(
            ECHO_EVAL_ECHO_MODEL
            ECHO_EVAL_CODEX_MODEL
            ECHO_EVAL_EXPECTED_CONFIG_SHA256
            ECHO_EVAL_EXPECTED_CODEX_SHA256
            ECHO_EVAL_EXPECTED_CODEX_TEAM_ID
            ECHO_EVAL_EXPECTED_CODEX_IDENTIFIER
          )
          for name in "${required_values[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Protected behavioral environment variable ${name} is required."
              exit 1
            fi
          done
          if [[ ! "${ECHO_EVAL_EXPECTED_CONFIG_SHA256}" =~ ^[0-9a-fA-F]{64}$ || \
                ! "${ECHO_EVAL_EXPECTED_CODEX_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Protected config and Codex SHA-256 values must be 64 hexadecimal characters."
            exit 1
          fi
          if [[ "${ECHO_CODEX_EXECUTABLE}" != "/Applications/ChatGPT.app/Contents/Resources/codex" || \
                ! -x "${ECHO_CODEX_EXECUTABLE}" ]]; then
            echo "::error::The fixed Codex Desktop executable is unavailable: ${ECHO_CODEX_EXECUTABLE}"
            exit 1
          fi

          observed_config_sha256="$(shasum -a 256 "${ECHO_EVAL_CONFIG}" | awk '{print tolower($1)}')"
          expected_config_sha256="$(printf '%s' "${ECHO_EVAL_EXPECTED_CONFIG_SHA256}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${observed_config_sha256}" != "${expected_config_sha256}" ]]; then
            echo "::error::Echo evaluation config SHA-256 does not match the protected identity."
            exit 1
          fi

          codesign --verify --strict --verbose=2 "${ECHO_CODEX_EXECUTABLE}"
          signature_metadata="$(codesign -dv --verbose=4 "${ECHO_CODEX_EXECUTABLE}" 2>&1)"
          observed_team_id="$(awk -F= '/^TeamIdentifier=/{print $2; exit}' <<<"${signature_metadata}")"
          observed_identifier="$(awk -F= '/^Identifier=/{print $2; exit}' <<<"${signature_metadata}")"
          observed_codex_sha256="$(shasum -a 256 "${ECHO_CODEX_EXECUTABLE}" | awk '{print tolower($1)}')"
          expected_codex_sha256="$(printf '%s' "${ECHO_EVAL_EXPECTED_CODEX_SHA256}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${observed_codex_sha256}" != "${expected_codex_sha256}" || \
                "${observed_team_id}" != "${ECHO_EVAL_EXPECTED_CODEX_TEAM_ID}" || \
                "${observed_identifier}" != "${ECHO_EVAL_EXPECTED_CODEX_IDENTIFIER}" ]]; then
            echo "::error::Codex executable hash or Apple code-signing identity is not approved."
            exit 1
          fi

          export ECHO_EVAL_OBSERVED_CONFIG_SHA256="${observed_config_sha256}"
          export ECHO_EVAL_OBSERVED_CODEX_SHA256="${observed_codex_sha256}"
          export ECHO_EVAL_OBSERVED_CODEX_TEAM_ID="${observed_team_id}"
          export ECHO_EVAL_OBSERVED_CODEX_IDENTIFIER="${observed_identifier}"
          mkdir -p benchmarks/results
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          schema = "echo.behavioral_system_provenance.v1"
          echo = {
              "schema": schema,
              "system_id": "echo",
              "model": {
                  "expected": os.environ["ECHO_EVAL_ECHO_MODEL"],
                  "requested": os.environ["ECHO_EVAL_ECHO_MODEL"],
              },
              "config": {
                  "expected_sha256": os.environ["ECHO_EVAL_EXPECTED_CONFIG_SHA256"].lower(),
                  "observed_sha256": os.environ["ECHO_EVAL_OBSERVED_CONFIG_SHA256"],
              },
          }
          codex = {
              "schema": schema,
              "system_id": "codex",
              "model": {
                  "expected": os.environ["ECHO_EVAL_CODEX_MODEL"],
                  "requested": os.environ["ECHO_EVAL_CODEX_MODEL"],
              },
              "executable": {
                  "path": os.environ["ECHO_CODEX_EXECUTABLE"],
                  "expected_sha256": os.environ["ECHO_EVAL_EXPECTED_CODEX_SHA256"].lower(),
                  "observed_sha256": os.environ["ECHO_EVAL_OBSERVED_CODEX_SHA256"],
                  "codesign": {
                      "expected_team_identifier": os.environ["ECHO_EVAL_EXPECTED_CODEX_TEAM_ID"],
                      "observed_team_identifier": os.environ["ECHO_EVAL_OBSERVED_CODEX_TEAM_ID"],
                      "expected_identifier": os.environ["ECHO_EVAL_EXPECTED_CODEX_IDENTIFIER"],
                      "observed_identifier": os.environ["ECHO_EVAL_OBSERVED_CODEX_IDENTIFIER"],
                  },
              },
          }
          for name, payload in (("echo", echo), ("codex", codex)):
              Path(f"benchmarks/results/{name}-provenance.json").write_text(
                  json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Start isolated Echo evaluation server
        run: |
          set -euo pipefail
          mkdir -p "${ECHO_DATA_DIR}"
          .venv/bin/python -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 18080)); s.close()'
          .venv/bin/python -m runtime serve \
            --config "${ECHO_EVAL_CONFIG}" \
            --host 127.0.0.1 \
            --port 18080 \
            >"${ECHO_EVAL_SERVER_LOG}" 2>&1 &
          backend_pid=$!
          echo "ECHO_EVAL_BACKEND_PID=${backend_pid}" >> "${GITHUB_ENV}"

          ready=0
          for _ in {1..90}; do
            if ! kill -0 "${backend_pid}" 2>/dev/null; then
              tail -n 200 "${ECHO_EVAL_SERVER_LOG}" || true
              echo "::error::Echo evaluation server exited during startup."
              exit 1
            fi
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "${ready}" != "1" ]]; then
            tail -n 200 "${ECHO_EVAL_SERVER_LOG}" || true
            echo "::error::Echo evaluation server did not become healthy."
            exit 1
          fi

      - name: Run fixed suite against Echo
        env:
          ECHO_API_TOKEN: ${{ secrets.ECHO_API_TOKEN }}
          ECHO_EVAL_LOCAL_PASSWORD: ${{ secrets.ECHO_EVAL_LOCAL_PASSWORD }}
        run: |
          set -euo pipefail
          auth_args=()
          if [[ -n "${ECHO_EVAL_LOCAL_USERNAME}" ]]; then
            auth_args+=(--echo-local-username "${ECHO_EVAL_LOCAL_USERNAME}")
          fi
          status=0
          .venv/bin/python -m benchmarks.run_behavioral_suite \
            --system echo \
            --model "${ECHO_EVAL_ECHO_MODEL}" \
            --provenance-file benchmarks/results/echo-provenance.json \
            --echo-config-path "${ECHO_EVAL_CONFIG}" \
            --k 3 \
            --timeout 900 \
            --echo-url ws://127.0.0.1:18080/api/realtime \
            --artifact-dir benchmarks/results/behavioral-artifacts \
            --output benchmarks/results/echo-full.json \
            "${auth_args[@]}" || status=$?
          if (( status > 1 )); then
            echo "::error::Echo run was unscored or failed to execute (status ${status})."
            exit "${status}"
          fi

      - name: Run identical fixed suite against Codex Desktop
        run: |
          set -euo pipefail
          status=0
          .venv/bin/python -m benchmarks.run_behavioral_suite \
            --system codex \
            --codex-surface desktop \
            --codex-executable "${ECHO_CODEX_EXECUTABLE}" \
            --model "${ECHO_EVAL_CODEX_MODEL}" \
            --provenance-file benchmarks/results/codex-provenance.json \
            --k 3 \
            --timeout 900 \
            --artifact-dir benchmarks/results/behavioral-artifacts \
            --output benchmarks/results/codex-full.json || status=$?
          if (( status > 1 )); then
            echo "::error::Codex run was unscored or failed to execute (status ${status})."
            exit "${status}"
          fi

      - name: Assemble and validate commit-bound evidence
        run: |
          .venv/bin/python -m benchmarks.assemble_behavioral_bundle \
            --echo-run benchmarks/results/echo-full.json \
            --codex-run benchmarks/results/codex-full.json \
            --source-revision "${GITHUB_SHA}" \
            --output benchmarks/results/behavioral-surpass-latest.json

      - name: Run full production readiness gate
        env:
          ECHO_BEHAVIORAL_EVAL_BUNDLE: benchmarks/results/behavioral-surpass-latest.json
          ECHO_READINESS_HOME: ${{ runner.temp }}/echo-release-readiness
          ECHO_READINESS_DATA_DIR: ${{ runner.temp }}/echo-release-readiness/data
          ECHO_READINESS_REPORT: benchmarks/results/release-readiness.json
          PYTHON: .venv/bin/python
        run: make production-readiness

      - name: Upload commit-bound behavioral evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: behavioral-surpass-evidence-${{ github.sha }}
          path: |
            benchmarks/results/behavioral-surpass-latest.json
            benchmarks/results/echo-full.json
            benchmarks/results/codex-full.json
            benchmarks/results/echo-provenance.json
            benchmarks/results/codex-provenance.json
            benchmarks/results/behavioral-artifacts
            benchmarks/results/release-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated Echo evaluation server
        if: always()
        run: |
          if [[ -n "${ECHO_EVAL_BACKEND_PID:-}" ]] && \
             kill -0 "${ECHO_EVAL_BACKEND_PID}" 2>/dev/null; then
            kill "${ECHO_EVAL_BACKEND_PID}" || true
            wait "${ECHO_EVAL_BACKEND_PID}" || true
          fi
