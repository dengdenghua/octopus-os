name: Publish signed plugin content

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Repository that owns the echo-content release
        required: true
        default: dengdenghua/workbuddy-expert-market

permissions:
  contents: read

concurrency:
  group: signed-plugin-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish signed marketplace content
    runs-on: ubuntu-24.04
    environment: plugin-content-signing
    env:
      CI: "true"
      UV_PYTHON_DOWNLOADS: never
      ECHO_PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.ECHO_PLUGIN_SIGNING_PRIVATE_KEY }}
      ECHO_PLUGIN_SIGNING_PUBLIC_KEY: ${{ vars.ECHO_PLUGIN_SIGNING_PUBLIC_KEY }}
      ECHO_PLUGIN_SIGNING_PUBLISHER_ID: ${{ vars.ECHO_PLUGIN_SIGNING_PUBLISHER_ID }}
      ECHO_PLUGIN_SIGNING_KEY_ID: ${{ vars.ECHO_PLUGIN_SIGNING_KEY_ID }}
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          submodules: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate protected release identity
        run: |
          set -euo pipefail
          test -n "${ECHO_PLUGIN_SIGNING_PRIVATE_KEY}" || { echo "::error::missing plugin signing private key"; exit 1; }
          test -n "${ECHO_PLUGIN_SIGNING_PUBLIC_KEY}" || { echo "::error::missing plugin signing public key"; exit 1; }
          test -n "${ECHO_PLUGIN_SIGNING_KEY_ID}" || { echo "::error::missing plugin signing key id"; exit 1; }

      - name: Install locked build dependencies
        run: uv sync --locked --python 3.11.9 --extra desktop-core

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build independent workbench surfaces
        working-directory: frontend
        run: pnpm build:workbenches

      - name: Materialize and cross-check public trust key
        run: >-
          ./.venv/bin/python scripts/configure_builtin_plugin_publisher.py
          --output "${RUNNER_TEMP}/plugin-publishers.json"

      - name: Build and sign marketplace catalog indexes
        run: |
          set -euo pipefail
          ./.venv/bin/python extensions/workbuddy-experts/scripts/build-plugin-store.py
          ./.venv/bin/python extensions/workbuddy-experts/scripts/build-skill-registry.py
          ./.venv/bin/python extensions/workbuddy-experts/scripts/sign-marketplace-catalog.py \
            extensions/workbuddy-experts/storefront/data/plugin-store.json \
            extensions/workbuddy-experts/storefront/data/skill-registry.json
          ./.venv/bin/python extensions/workbuddy-experts/scripts/sign-marketplace-catalog.py \
            --verify \
            --trust-store "${RUNNER_TEMP}/plugin-publishers.json" \
            extensions/workbuddy-experts/storefront/data/plugin-store.json \
            extensions/workbuddy-experts/storefront/data/skill-registry.json

      - name: Build signed plugin content pack
        run: >-
          ./.venv/bin/python
          extensions/workbuddy-experts/scripts/build-cloud-bundles.py
          --kind all

      - name: Prove catalog and content archive are one closed release
        run: >-
          ./.venv/bin/python
          extensions/workbuddy-experts/scripts/verify-marketplace-release.py
          --catalog extensions/workbuddy-experts/storefront/data/plugin-store.json
          --archive extensions/workbuddy-experts/remote/bundles/echo-plugins.tar.gz
      - name: Prove skill catalog and content archive are one closed release
        run: >-
          ./.venv/bin/python
          extensions/workbuddy-experts/scripts/verify-marketplace-release.py
          --kind skills
          --catalog extensions/workbuddy-experts/storefront/data/skill-registry.json
          --archive extensions/workbuddy-experts/remote/bundles/echo-skills.tar.gz

      - name: Verify every published package against the release trust key
        env:
          ECHO_PLUGIN_PUBLISHER_TRUST_STORE: ${{ runner.temp }}/plugin-publishers.json
        run: |
          set -euo pipefail
          pack="extensions/workbuddy-experts/remote/bundles/echo-plugins.tar.gz"
          extract="${RUNNER_TEMP}/plugin-content"
          mkdir -p "${extract}"
          tar -xzf "${pack}" -C "${extract}"
          ./.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from runtime.platform.plugins.workbench_package import (
              WorkbenchPackageStore,
              verify_workbench_package_trust,
          )
          from runtime.platform.plugins.marketplace_package import (
              verify_marketplace_package_trust,
          )

          plugins_root = Path(os.environ["RUNNER_TEMP"]) / "plugin-content" / "plugins"
          workbench_root = plugins_root / "workbench"
          store = WorkbenchPackageStore(workbench_root)
          workbenches = sorted(
              path.name for path in workbench_root.iterdir() if (path / "app.json").is_file()
          )
          if not workbenches:
              raise SystemExit("signed content pack contains no workbenches")
          for package_id in workbenches:
              manifest = store.load_manifest(package_id)
              trust = verify_workbench_package_trust(
                  workbench_root / package_id,
                  manifest,
                  require_trusted=True,
              )
              if not trust["publisher_verified"]:
                  raise SystemExit(f"publisher verification failed: {package_id}")
          verified = {"workbench": len(workbenches)}
          for kind in ("codex", "connector"):
              kind_root = plugins_root / kind
              packages = sorted(path for path in kind_root.iterdir() if path.is_dir())
              if not packages:
                  raise SystemExit(f"signed content pack contains no {kind} packages")
              for package in packages:
                  trust = verify_marketplace_package_trust(
                      package,
                      package_kind=kind,
                      plugin_id=package.name,
                      require_trusted=True,
                  )
                  if not trust["publisher_verified"]:
                      raise SystemExit(f"publisher verification failed: {kind}/{package.name}")
              verified[kind] = len(packages)
          print(f"verified signed marketplace packages: {verified}")
          PY
          sha256sum "${pack}" > "${pack}.sha256"
          for connector_pack in extensions/workbuddy-experts/remote/bundles/echo-connector-*.tar.gz; do
            sha256sum "${connector_pack}" > "${connector_pack}.sha256"
          done
          sha256sum extensions/workbuddy-experts/remote/bundles/echo-skills.tar.gz \
            > extensions/workbuddy-experts/remote/bundles/echo-skills.tar.gz.sha256
          cp "${RUNNER_TEMP}/plugin-publishers.json" \
            "extensions/workbuddy-experts/remote/bundles/plugin-publishers.json"

      - name: Publish immutable content assets
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}" || { echo "::error::missing MARKETPLACE_RELEASE_TOKEN"; exit 1; }
          if ! gh release view echo-content --repo "${TARGET_REPOSITORY}" >/dev/null 2>&1; then
            gh release create echo-content --repo "${TARGET_REPOSITORY}" \
              --title "Echo signed content" \
              --notes "Marketplace workbenches, plugins, and connectors signed by the protected EchoAI release key."
          fi
          gh release upload echo-content --repo "${TARGET_REPOSITORY}" --clobber \
            extensions/workbuddy-experts/remote/bundles/echo-plugins.tar.gz \
            extensions/workbuddy-experts/remote/bundles/echo-plugins.tar.gz.sha256 \
            extensions/workbuddy-experts/remote/bundles/echo-connector-*.tar.gz \
            extensions/workbuddy-experts/remote/bundles/echo-connector-*.tar.gz.sha256 \
            extensions/workbuddy-experts/remote/bundles/echo-skills.tar.gz \
            extensions/workbuddy-experts/remote/bundles/echo-skills.tar.gz.sha256 \
            extensions/workbuddy-experts/remote/bundles/plugin-publishers.json \
            extensions/workbuddy-experts/storefront/data/plugin-store.json \
            extensions/workbuddy-experts/storefront/data/plugin-store.provenance.json \
            extensions/workbuddy-experts/storefront/data/skill-registry.json \
            extensions/workbuddy-experts/storefront/data/skill-registry.provenance.json
