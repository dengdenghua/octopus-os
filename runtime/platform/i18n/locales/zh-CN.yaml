"cli.tour.ganglia_desc1": "GraphRuntime 把 TaskGraph 交给 ToolExecutor"
"cli.tour.ganglia_desc2": "每个节点走：TrustEngine 过滤 → Mantle 沙箱 → CircuitBreaker"
"cli.tour.ganglia_desc3": "失败可 resume · 断点续跑（journal 里找最后 ok 点）"
"cli.tour.ganglia_conclusion": "结论：Ganglia 是 DAG 执行器 · 不决策 · 只编排 + 护栏。"
"cli.tour.journal_desc1": "上下文块内 · 事件自动带 agent_id='{agent_id}' + conversation_id='{conv_id}'"
"cli.tour.journal_desc2": "Journal 是 append-only · 每条事件 frozen · ts 自动"
"cli.tour.journal_desc3": "StepEvent / TrajectoryEvent / ReflectionEvent 都写进去"
"cli.tour.journal_conclusion": "结论：Genome 日志是所有 reflection 和 resume 的唯一数据源。"
"cli.tour.hemolymph_desc1": "配额默认：system=0.15 / suckers=0.10 / memory=0.30 / history=0.45"
"cli.tour.hemolymph_desc2": "渐进披露 · 先 brief · 失败再 detailed"
"cli.tour.hemolymph_conclusion": "结论：Hemolymph 是 agent 的血液 · 把 context 摄入量 cap 死 · 防 LLM 过载。"
"cli.tour.immunity_desc1": "skill 白名单 · path 白名单 · url 白名单 · 三层防御"
"cli.tour.immunity_desc2": "不在白名单 → 抛 UntrustedSkill · 节点失败 · 但不污染其他节点"
"cli.tour.immunity_conclusion": "结论：Immunity 是最后一道硬防御 · 别让 LLM 的 hallucination 真跑起来。"
"cli.tour.ink_desc1": "三态机：closed → open → half-open"
"cli.tour.ink_desc2": "连续 3 次 error 开断 · cooldown 后试探单条"
"cli.tour.ink_desc3": "每 provider / skill 独立 breaker · 不株连"
"cli.tour.ink_conclusion": "结论：Ink 是章鱼喷墨 · 遇险自保 · 不让异常传染到其他 subsystem。"
"cli.tour.hearts_desc1": "holder_id={holder} · ttl={ttl}s · fencing_token={token}"
"cli.tour.hearts_desc2": "其他进程来抢 · acquire_lease 返 None（文件锁挡住）"
"cli.tour.hearts_conclusion": "结论：Hearts 是多节点协调 · 同机 FileLock · 跨机可接 Redis/Etcd Coordinator。"
"cli.tour.camouflage_desc1": "按 weight 分流 300 次 · baseline={baseline} aggressive={aggressive}"
"cli.tour.camouflage_desc2": "sticky by task_id · 同 task 同 variant"
"cli.tour.camouflage_conclusion": "结论：Camouflage 是章鱼变色 · A/B variant 活跃期 · 胜者自动升权 · 败者退役。"
"cli.tour.skin_desc1": "FileWatcher 检测到 {n} 个文件变动"
"cli.tour.skin_desc2": "事件 · {change} · {name}"
"cli.tour.skin_conclusion": "结论：Skin 是感知层 · FS/git/process 变化 → TypedEventBus · agent 可订阅反应。"
