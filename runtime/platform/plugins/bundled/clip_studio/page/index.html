<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 剪辑工坊</title>
  <style>
    :root{color-scheme:light;font-family:Inter,"PingFang SC",ui-sans-serif,system-ui;background:#fff;color:#18181b}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}.app{display:grid;grid-template-rows:44px 1fr 260px;height:100%}
    header{display:flex;align-items:center;gap:5px;padding:0 10px;border-bottom:1px solid #e7e7e9;background:#fff}
    button,.button{border:1px solid transparent;border-radius:8px;background:transparent;color:inherit;padding:7px 10px;font-size:11px;cursor:pointer}button:hover,.button:hover{background:#f3f3f4}.outline{border-color:#dedee1}.primary{background:#111;color:#fff}.primary:hover{background:#27272a}.grow{flex:1}
    .workspace{display:grid;grid-template-columns:310px 1fr;min-height:0}.library{border-right:1px solid #e7e7e9;background:#fff;overflow:auto}.tools{display:grid;grid-template-columns:repeat(5,1fr);height:64px;border-bottom:1px solid #ededee}.tool{display:grid;place-items:center;align-content:center;gap:4px;border-radius:0;color:#555}.tool.active{background:#f3f3f4;color:#111}.tool .icon{font-size:18px}.tool span:last-child{font-size:9px}
    .library-body{padding:13px}.search{display:flex;gap:7px}.search input{flex:1}.view{width:34px;padding:0}.drop{display:grid;place-items:center;height:190px;margin-top:28px;color:#71717a;font-size:11px;text-align:center}.upload{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 12px;border-radius:14px;background:#f3f3f4;font-size:26px}.catalog-hint{margin:9px 2px 12px;color:#8b8b93;font-size:9px}.catalog-group{margin:13px 0 6px;color:#8b8b93;font-size:9px;font-weight:600}.catalog-item{display:block;width:100%;margin:4px 0;padding:9px 10px;border:1px solid #ededee;border-radius:9px;text-align:left;background:#fff}.catalog-item:hover{border-color:#d4d4d8;background:#fafafa}.catalog-item strong{display:block;font-size:10px}.catalog-item small{display:block;margin-top:3px;color:#71717a;font-size:9px}.notice{position:fixed;right:16px;bottom:16px;z-index:5;border-radius:9px;background:#18181b;color:#fff;padding:9px 12px;font-size:10px;box-shadow:0 10px 30px #0003}.preview-shell{display:grid;grid-template-rows:1fr 43px;min-width:0;background:#f5f5f7}.preview{display:grid;place-items:center;padding:24px}.preview video{max-width:88%;max-height:90%;background:#000;box-shadow:0 18px 60px #0002}.empty-frame{display:grid;place-items:center;width:min(76%,680px);aspect-ratio:16/9;background:#09090b;color:#555;font-size:10px;box-shadow:0 18px 60px #0002}
    .adjust-grid{display:grid;grid-template-columns:1fr 64px;gap:9px;align-items:center}.adjust-grid label{font-size:9px;color:#71717a}.adjust-grid input,.adjust-grid select{height:28px;padding:4px 6px}.keyframe-row{display:flex;gap:6px;margin-top:12px}.keyframe-row button{flex:1;border-color:#dedee1}.exporting{opacity:.6;pointer-events:none}
    .transport{display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid #e1e1e4;background:#fff;font-size:10px}.play{display:grid;place-items:center;width:31px;height:31px;border-radius:8px;background:#111;color:#fff}.time{position:absolute;left:326px;font-family:ui-monospace,monospace;font-weight:600}.ratio{position:absolute;right:18px;color:#666}
    .timeline{border-top:1px solid #dedee1;background:#fff;overflow:auto}.timeline-tools{display:flex;align-items:center;height:44px;gap:4px;padding:0 12px;border-bottom:1px solid #ededee}.timeline-tools button{padding:6px 8px}.divider{width:1px;height:18px;background:#ddd}.ruler{height:30px;margin-left:94px;background:repeating-linear-gradient(90deg,#cfcfd3 0 1px,transparent 1px 120px);color:#8b8b93;font-size:9px;padding-top:7px}.playhead{position:absolute;left:116px;top:74px;bottom:0;width:1px;background:#202023}.playhead:before{content:"";position:absolute;left:-5px;top:-4px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #202023}
    .tracks{position:relative;padding:0 10px 16px}.track{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center;margin-top:6px}.label{font-size:10px;color:#666}.lane{position:relative;height:38px;border-radius:4px;background:#f0f0f2;overflow:hidden}.clip{position:absolute;inset:3px auto 3px 3px;width:min(72%,560px);border:2px solid transparent;border-radius:4px;background:linear-gradient(90deg,#5b5bd6,#8b5cf6);padding:5px;color:#fff;font-size:9px;white-space:nowrap;overflow:hidden;cursor:pointer}.clip.selected{border-color:#18181b;box-shadow:0 0 0 2px #fff}.caption{width:40%;left:20%;background:linear-gradient(90deg,#d97706,#f59e0b)}
    input,textarea{width:100%;border:1px solid #dfdfe2;border-radius:8px;background:#fafafa;color:inherit;padding:8px;font-size:10px;outline:none}input:focus,textarea:focus{border-color:#999}.dialog{position:fixed;inset:0;display:grid;place-items:center;background:#0005}.dialog[hidden]{display:none}.card{width:320px;border-radius:14px;background:#fff;padding:16px;box-shadow:0 24px 80px #0004}.card h3{margin:0 0 12px;font-size:13px}.card label{display:block;margin:10px 0 5px;font-size:10px;color:#71717a}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:13px}
  </style>
</head>
<body>
<div class="app">
  <header><strong id="projectName">AI 剪辑工坊</strong><span class="grow"></span><button id="undo" title="撤销">↶</button><button id="redo" title="重做">↷</button><button id="diagnose" title="检查时间线">检查</button><button class="primary" id="save">⇧ 导出⌄</button><button id="exit">退出编辑</button></header>
  <section class="workspace">
    <aside class="library">
      <div class="tools"><button class="tool active" id="mediaTool"><span class="icon">▣</span><span>媒体</span></button><button class="tool" id="textTool"><span class="icon">T</span><span>文字</span></button><button class="tool"><span class="icon">♧</span><span>图形</span></button><button class="tool" id="effectTool"><span class="icon">ϟ</span><span>效果</span></button><button class="tool" id="transitionTool"><span class="icon">⤨</span><span>转场</span></button></div>
      <div class="library-body" id="libraryBody"><div class="search"><input placeholder="⌕  搜索媒体"><button class="view outline">▦</button><button class="view">☷</button></div><div class="drop" id="drop"><div><label class="upload" for="media">⇧</label><strong>尚未导入媒体</strong><p>拖拽文件到此处或点击导入</p><label class="button outline" for="media">导入媒体</label><input id="media" type="file" accept="video/*,audio/*,image/*" hidden></div></div></div>
    </aside>
    <main class="preview-shell"><div class="preview"><video id="video" controls hidden></video><div class="empty-frame" id="empty">导入素材后在这里预览</div></div><div class="transport"><span class="time">00:00:00 / 00:00:00</span><button>↶5</button><button class="play" id="play">▶</button><button>5↷</button><button>⌕</button><span class="ratio">16:9⌄　100%　⛶</span></div></main>
  </section>
  <section class="timeline"><div class="timeline-tools"><button id="timelineUndo">↶</button><button id="timelineRedo">↷</button><button disabled>✂</button><button disabled>⌫</button><span class="divider"></span><button>＋</button><button>▱</button><button id="caption">字幕⌄</button><button id="adjust">调整</button><button>🧲</button><span class="grow"></span><button>▰</button><button>▤</button><button>⊖</button><input type="range" min="20" max="120" value="50" style="width:100px"><button>⊕</button><button>↗</button></div><div class="ruler">00:00　　　　　　00:05　　　　　　00:10　　　　　　00:15</div><div class="tracks"><span class="playhead"></span><div class="track"><div class="label">视频 1</div><div class="lane" id="videoLane"></div></div><div class="track"><div class="label">字幕</div><div class="lane" id="textLane"></div></div><div class="track"><div class="label">音频 1</div><div class="lane" id="audioLane"></div></div></div></section>
</div>
<div class="dialog" id="captionDialog" hidden><div class="card"><h3>添加字幕</h3><label>字幕内容</label><textarea id="text" rows="4" placeholder="输入字幕内容"></textarea><label>显示时间</label><input value="00:00 — 00:03"><div class="actions"><button id="cancel">取消</button><button class="primary" id="addCaption">添加</button></div></div></div>
<script>
  const projectId=new URLSearchParams(location.search).get('project')||'default';const projectApi='/api/plugins/clip-studio/projects/'+encodeURIComponent(projectId);const state={media:null,captions:[],project:null,selectedClipId:null,libraryMode:'media'};const video=document.querySelector('#video'),empty=document.querySelector('#empty'),dialog=document.querySelector('#captionDialog'),libraryBody=document.querySelector('#libraryBody');const mediaMarkup=libraryBody.innerHTML;
  const effects=[
    {group:'基础',type:'brightness',name:'亮度',desc:'提亮中间调和高光',params:{amount:1.12}},{group:'基础',type:'contrast',name:'对比度',desc:'增强阴影与高光对比',params:{amount:1.15}},{group:'基础',type:'saturation',name:'饱和度',desc:'增强或降低色彩强度',params:{amount:1.18}},
    {group:'颜色',type:'temperature',name:'色温',desc:'调整画面冷暖色调',params:{amount:18}},{group:'颜色',type:'tint',name:'色调',desc:'在洋红与绿色之间偏移',params:{amount:12}},{group:'颜色',type:'hue',name:'色相',desc:'旋转色相环',params:{amount:18}},
    {group:'模糊',type:'blur',name:'模糊',desc:'柔和的高斯虚化',params:{amount:2.5}},{group:'模糊',type:'motion_blur',name:'运动模糊',desc:'添加方向性拖影',params:{amount:8}},{group:'模糊',type:'radial_blur',name:'径向模糊',desc:'缩放式径向动感',params:{amount:35}},
    {group:'创意',type:'sharpen',name:'锐化',desc:'增强画面边缘细节',params:{amount:1.8}},{group:'创意',type:'vignette',name:'暗角',desc:'压暗边缘以突出中心',params:{amount:.55}},{group:'创意',type:'grain',name:'胶片颗粒',desc:'模拟胶片颗粒质感',params:{amount:.08}},
    {group:'风格化',type:'shadow',name:'投影',desc:'添加柔和投影',params:{amount:.55}},{group:'风格化',type:'glow',name:'辉光',desc:'添加明亮的外发光',params:{amount:.3}},{group:'风格化',type:'chromatic_aberration',name:'色差',desc:'产生 RGB 通道分离偏移',params:{amount:4}}
  ];
  const transitions=[{type:'crossfade',name:'交叉淡化',desc:'在片段之间平滑混合'},{type:'fade-black',name:'淡入黑场',desc:'通过黑色淡化过渡'},{type:'fade-white',name:'淡入白场',desc:'通过白色淡化过渡'},{type:'wipe',name:'擦除',desc:'从一个片段擦除至另一个片段'},{type:'slide',name:'滑动',desc:'新片段滑入并覆盖原片段'},{type:'push',name:'推动',desc:'新片段将原片段推出'},{type:'zoom',name:'缩放',desc:'在片段之间缩放过渡'}];
  function safe(value){return String(value).replace(/[<>]/g,'')}
  function notice(message){document.querySelector('.notice')?.remove();const node=document.createElement('div');node.className='notice';node.textContent=message;document.body.append(node);setTimeout(()=>node.remove(),2200)}
  function clipHtml(clip,total,caption){const start=Math.max(0,Number(clip.startSec)||0),end=Math.max(start+.01,Number(clip.endSec)||start+1),left=total?start/total*100:0,width=total?Math.max(4,(end-start)/total*100):72,selected=clip.id===state.selectedClipId?' selected':'';return '<div class="clip '+(caption?'caption':'')+selected+'" data-clip-id="'+safe(clip.id||'')+'" style="left:'+left+'%;width:'+width+'%">'+safe(clip.text||clip.name||'片段')+'</div>'}
  function renderProject(project){state.project=project;const editable=(project.clips||[]).filter(c=>c.trackName?.includes('视频'));if(!editable.some(c=>c.id===state.selectedClipId))state.selectedClipId=editable[0]?.id||null;const total=Math.max(1,Number(project.durationSec)||1);document.querySelector('#projectName').textContent=project.settings?.name||'AI 剪辑工坊';document.querySelector('.time').textContent='00:00:00 / '+new Date(total*1000).toISOString().slice(11,19);document.querySelector('#videoLane').innerHTML=editable.map(c=>clipHtml(c,total,false)).join('');document.querySelector('#audioLane').innerHTML=(project.clips||[]).filter(c=>c.trackName?.includes('音频')).map(c=>clipHtml(c,total,false)).join('');document.querySelector('#textLane').innerHTML=(project.textClips||[]).map(c=>clipHtml(c,total,true)).join('');document.querySelectorAll('.clip[data-clip-id]').forEach(node=>node.onclick=()=>{state.selectedClipId=node.dataset.clipId;renderProject(state.project)})}
  async function refresh(){try{const response=await fetch(projectApi+'?view=full');if(response.ok)renderProject(await response.json())}catch(error){console.warn('project load failed',error)}}
  async function history(action){await fetch(projectApi+'/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});await refresh()}
  function load(f){if(!f)return;state.media={name:f.name,type:f.type,size:f.size};document.querySelector('#drop').innerHTML='<div><div class="upload">✓</div><strong>'+safe(f.name)+'</strong><p>已加入媒体库</p></div>';document.querySelector('#videoLane').innerHTML='<div class="clip">'+safe(f.name)+'</div>';if(f.type.startsWith('video/')){video.src=URL.createObjectURL(f);video.hidden=false;empty.hidden=true}}
  function bindMedia(){const file=document.querySelector('#media'),drop=document.querySelector('#drop');file.onchange=()=>load(file.files[0]);drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])}}
  function setTool(id){document.querySelectorAll('.tool').forEach(tool=>tool.classList.toggle('active',tool.id===id))}
  function showMedia(){state.libraryMode='media';setTool('mediaTool');libraryBody.innerHTML=mediaMarkup;bindMedia()}
  function renderCatalog(mode,query=''){const source=mode==='effects'?effects:transitions,needle=query.trim().toLowerCase(),matches=source.filter(item=>[item.group,item.name,item.desc].join(' ').toLowerCase().includes(needle));let html='<div class="search"><input id="catalogSearch" placeholder="⌕  搜索'+(mode==='effects'?'效果':'转场')+'"></div><p class="catalog-hint">先在时间线选择视频片段，再点击应用。</p>',group='';for(const item of matches){if(item.group&&item.group!==group){group=item.group;html+='<div class="catalog-group">'+safe(group)+'</div>'}html+='<button class="catalog-item" data-kind="'+safe(item.type)+'"><strong>'+safe(item.name)+'</strong><small>'+safe(item.desc)+'</small></button>'}libraryBody.innerHTML=html;const input=document.querySelector('#catalogSearch');input.value=query;input.oninput=()=>renderCatalog(mode,input.value);document.querySelectorAll('.catalog-item').forEach(button=>button.onclick=()=>applyCatalogItem(mode,button.dataset.kind))}
  function showCatalog(mode){state.libraryMode=mode;setTool(mode==='effects'?'effectTool':'transitionTool');renderCatalog(mode)}
  function showAdjust(){state.libraryMode='adjust';setTool('');const clip=(state.project?.clips||[]).find(item=>item.id===state.selectedClipId);if(!clip){notice('请先选择一个视频片段');return}const t=clip.transform||{};libraryBody.innerHTML='<h3 style="font-size:12px;margin:0 0 14px">片段调整</h3><div class="adjust-grid"><label>位置 X</label><input data-transform="x" type="number" step=".01" value="'+(t.x||0)+'"><label>位置 Y</label><input data-transform="y" type="number" step=".01" value="'+(t.y||0)+'"><label>缩放</label><input data-transform="scale" type="number" min=".01" max="8" step=".05" value="'+(t.scale||1)+'"><label>旋转</label><input data-transform="rotation" type="number" step="1" value="'+(t.rotation||0)+'"><label>不透明度</label><input data-transform="opacity" type="number" min="0" max="1" step=".05" value="'+(t.opacity??1)+'"><label>混合模式</label><select data-transform="blendMode"><option value="normal">正常</option><option value="screen">滤色</option><option value="multiply">正片叠底</option><option value="add">添加</option></select></div><div class="keyframe-row"><button id="applyTransform">应用参数</button><button id="addKeyframe">在播放头添加关键帧</button></div><p class="catalog-hint">关键帧写入当前播放头；移动播放头后再次添加即可形成动画。</p>';libraryBody.querySelector('[data-transform="blendMode"]').value=t.blendMode||'normal';document.querySelector('#applyTransform').onclick=applyTransform;document.querySelector('#addKeyframe').onclick=addTransformKeyframes}
  function transformPayload(){const payload={type:'set_clip_transform',clipId:state.selectedClipId};libraryBody.querySelectorAll('[data-transform]').forEach(input=>payload[input.dataset.transform]=input.dataset.transform==='blendMode'?input.value:Number(input.value));return payload}
  async function applyTransform(){const response=await fetch(projectApi+'/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:'调整片段',operations:[transformPayload()]})});if(!response.ok){notice('片段调整失败');return}notice('片段参数已更新');await refresh();showAdjust()}
  async function addTransformKeyframes(){const clip=(state.project?.clips||[]).find(item=>item.id===state.selectedClipId),playhead=Number(state.project?.playheadSec||0),atSec=Math.min(Number(clip?.endSec||playhead),Math.max(Number(clip?.startSec||0),playhead)),payload=transformPayload(),operations=['x','y','scale','rotation','opacity'].map(property=>({type:'set_keyframe',clipId:state.selectedClipId,property,atSec,value:payload[property],easing:'ease-in-out'}));const response=await fetch(projectApi+'/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:'添加关键帧',operations})});if(!response.ok){notice('关键帧必须位于当前片段范围内');return}notice('已在 '+atSec.toFixed(2)+' 秒添加 5 个关键帧');await refresh();showAdjust()}
  async function applyCatalogItem(mode,type){if(!state.selectedClipId){notice('请先选择一个视频片段');return}const item=(mode==='effects'?effects:transitions).find(entry=>entry.type===type),operation=mode==='effects'?{type:'add_effect',clipId:state.selectedClipId,effectType:type,params:item.params}:{type:'add_transition',clipId:state.selectedClipId,transitionType:type,durationSec:.6,edge:'out'};const response=await fetch(projectApi+'/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:'应用'+item.name,operations:[operation]})});if(!response.ok){notice('应用失败，请稍后重试');return}notice('已应用「'+item.name+'」');await refresh()}
  bindMedia();document.querySelector('#mediaTool').onclick=showMedia;document.querySelector('#effectTool').onclick=()=>showCatalog('effects');document.querySelector('#transitionTool').onclick=()=>showCatalog('transitions');document.querySelector('#adjust').onclick=showAdjust;
  document.querySelector('#play').onclick=()=>video.paused?video.play():video.pause();document.querySelector('#caption').onclick=()=>dialog.hidden=false;document.querySelector('#textTool').onclick=()=>dialog.hidden=false;document.querySelector('#cancel').onclick=()=>dialog.hidden=true;
  document.querySelector('#addCaption').onclick=async()=>{const value=document.querySelector('#text').value.trim()||'新字幕';state.captions.push({text:value,start:0,duration:3});await fetch(projectApi+'/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:'添加字幕',operations:[{type:'add_text',text:value,atSec:0,durationSec:3}]})});dialog.hidden=true;await refresh()};
  document.querySelector('#undo').onclick=()=>history('undo');document.querySelector('#timelineUndo').onclick=()=>history('undo');document.querySelector('#redo').onclick=()=>history('redo');document.querySelector('#timelineRedo').onclick=()=>history('redo');document.querySelector('#diagnose').onclick=async()=>{const response=await fetch(projectApi+'/diagnostics'),payload=await response.json();alert(payload.clean?'时间线检查通过':'发现 '+payload.issues.length+' 个时间线问题')};
  document.querySelector('#save').onclick=async()=>{const button=document.querySelector('#save');button.classList.add('exporting');button.textContent='正在编码…';try{const response=await fetch(projectApi+'/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({maxDim:1280,includeAudio:true})});if(!response.ok)throw new Error('export failed');const payload=await response.json(),file=await fetch(projectApi+'/export/file'),blob=await file.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.project?.settings?.name||projectId)+'.mp4';a.click();URL.revokeObjectURL(a.href);notice('MP4 导出完成 · '+Math.round(payload.size/1024/1024*10)/10+' MB')}catch(error){notice('成片导出失败，请先检查时间线')}finally{button.classList.remove('exporting');button.textContent='⇧ 导出⌄'}};
  document.querySelector('#exit').onclick=()=>window.parent.postMessage({type:'echo.design.close-surface'},'*');
  refresh();
</script>
</body>
</html>
