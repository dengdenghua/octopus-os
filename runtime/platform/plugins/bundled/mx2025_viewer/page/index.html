<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>萌侠消息中心</title>
<style>
  :root{
    --bg:#f5f5f7; --bar:rgba(255,255,255,.82); --line:rgba(60,60,67,.18);
    --brand:#0a84ff; --brand2:#5ac8fa; --text:#1d1d1f; --muted:#6e6e73;
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .topbar{height:58px; display:flex; align-items:center; gap:10px; padding:0 18px;
    background:var(--bar); border-bottom:1px solid var(--line); backdrop-filter:saturate(180%) blur(22px);}
  .topbar .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .topbar .mark{width:32px; height:32px; display:grid; place-items:center; border-radius:10px;
    color:#fff; font-size:15px; font-weight:700; background:linear-gradient(145deg,var(--brand),var(--brand2));
    box-shadow:0 3px 10px rgba(10,132,255,.22);}
  .topbar .title{font-size:14px; font-weight:650; letter-spacing:-.1px; white-space:nowrap;}
  .topbar .status{font-size:11px; color:#6e6e73; display:flex; align-items:center; gap:6px; white-space:nowrap;}
  .topbar .status:before{content:""; width:7px; height:7px; border-radius:50%; background:#30d158;
    box-shadow:0 0 0 3px rgba(48,209,88,.12);}
  .topbar .sp{flex:1;}
  .topbar a,.topbar button{height:32px; display:inline-flex; align-items:center; gap:6px; font-size:12px;
    color:#3a3a3c; text-decoration:none; border:1px solid rgba(60,60,67,.12); border-radius:9px;
    padding:0 11px; background:rgba(118,118,128,.09); cursor:pointer; transition:.16s ease;}
  .topbar a:hover,.topbar button:hover{color:#1d1d1f; border-color:rgba(60,60,67,.18); background:rgba(118,118,128,.15);}
  .topbar button.active{color:#0066cc; border-color:rgba(10,132,255,.25); background:rgba(10,132,255,.1);}
  .topbar select{height:32px; max-width:150px; color:#1d1d1f; border:1px solid rgba(60,60,67,.12); border-radius:9px;
    padding:0 28px 0 10px; background:rgba(118,118,128,.09); outline:none; cursor:pointer;}
  #frameWrap{position:absolute; top:58px; left:0; right:0; bottom:0;}
  #frameWrap iframe{width:100%; height:100%; border:0;}
  .loadmask{position:absolute; inset:58px 0 0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; line-height:1.8; text-align:center;
    padding:24px; background:var(--bg); z-index:2;}
  .loadmask.hide{display:none;}
  .group-modal{position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    padding:20px; background:rgba(4,8,18,.62); backdrop-filter:blur(8px);}
  .group-modal.show{display:flex;}
  .group-card{width:min(520px,100%); max-height:min(680px,calc(100vh - 40px)); overflow:auto; color:#1d1d1f;
    border:1px solid rgba(60,60,67,.16); border-radius:22px; background:rgba(255,255,255,.96); box-shadow:0 24px 70px rgba(0,0,0,.2);}
  .group-head{position:sticky; top:0; z-index:2; display:flex; align-items:center; padding:17px 18px;
    border-bottom:1px solid #edf0f5; background:rgba(255,255,255,.94); backdrop-filter:blur(14px);}
  .group-head h2{font-size:17px;}.group-head p{margin-top:3px; color:#8a93a6; font-size:12px;}
  .group-head .sp{flex:1;}.group-close{width:32px;height:32px;border:0;border-radius:9px;background:#f1f3f7;cursor:pointer;font-size:18px;}
  .group-body{padding:16px 18px 20px;}.group-section{margin-bottom:18px;}
  .group-label{display:block;margin-bottom:8px;color:#697386;font-size:12px;font-weight:700;}
  .group-assignment{display:flex;gap:8px}.group-assignment select,.group-new input,.group-row input{
    min-width:0;height:38px;flex:1;border:1px solid #dfe3eb;border-radius:10px;padding:0 10px;background:#fafbfc;outline:none;}
  .group-assignment select:focus,.group-new input:focus,.group-row input:focus{border-color:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,.1)}
  .group-rows{display:grid;gap:8px}.group-row,.group-new{display:flex;align-items:center;gap:8px}
  .group-row button,.group-new button{height:36px;border:1px solid #dfe3eb;border-radius:9px;padding:0 11px;background:#fff;color:#596274;cursor:pointer;}
  .group-row button:hover,.group-new button:hover{border-color:#0a84ff;color:#0071e3;background:#f2f8ff}
  .group-row button.danger:hover{border-color:#ef7686;color:#d83f55;background:#fff5f6}
  .group-new{padding-top:10px;margin-top:10px;border-top:1px solid #edf0f5}.group-new button{color:#fff;border-color:#0a84ff;background:#0a84ff}
  .group-empty{padding:12px;border-radius:10px;color:#8a93a6;background:#f6f7f9;font-size:13px}.group-error{min-height:18px;margin-top:10px;color:#d83f55;font-size:12px}
  @media(max-width:680px){
    .topbar{padding:0 10px; gap:8px;}
    .topbar .status{display:none;}
    .topbar .title{display:none;}
    .topbar select{max-width:115px;}
    .topbar a,.topbar button{padding:0 9px;}
    .topbar a span{display:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark">M</span>
    <span class="title">萌侠消息中心</span>
  </div>
  <span class="status" id="syncStatus">本地采集中</span>
  <span class="sp"></span>
  <select id="groupFilter" title="筛选分组"><option value="all">全部对话</option></select>
  <button id="groupManage" type="button">分组管理</button>
  <button id="syncManage" type="button">云端连接</button>
  <button id="inactiveToggle" type="button" hidden>已收起 0 个</button>
  <a id="openExt" href="__MX_OPEN_URL__" target="_blank" rel="noopener" title="在新窗口打开"><span>新窗口</span> ↗</a>
</div>

<div class="group-modal" id="syncModal" aria-hidden="true">
  <section class="group-card" role="dialog" aria-modal="true" aria-labelledby="syncTitle">
    <header class="group-head">
      <div><h2 id="syncTitle">云端连接</h2><p>本机采集，云端负责订阅、Agent 与推送</p></div>
      <span class="sp"></span><button class="group-close" id="syncClose" type="button" aria-label="关闭">×</button>
    </header>
    <div class="group-body">
      <form id="syncForm" autocomplete="off">
        <section class="group-section"><label class="group-label" for="syncCloudUrl">云端地址</label>
          <div class="group-new"><input id="syncCloudUrl" name="echo_cloud_endpoint" type="url" autocomplete="off" spellcheck="false" placeholder="https://你的云端域名" required></div></section>
        <section class="group-section"><label class="group-label" for="syncPairingCode">一次性配对码</label>
          <div class="group-new"><input id="syncPairingCode" name="echo_device_pairing_code" type="password" autocomplete="new-password" placeholder="oct_pair_…" required></div></section>
        <section class="group-section"><label class="group-label" for="syncDeviceName">设备名称</label>
          <div class="group-new"><input id="syncDeviceName" name="echo_device_name" autocomplete="off" maxlength="80" value="Echo Desktop"></div></section>
        <div class="group-new"><button type="submit">连接云端</button><button id="syncNow" type="button">立即同步</button><button id="syncDisconnect" class="danger" type="button">断开</button></div>
        <div class="group-error" id="syncError"></div><div class="group-empty" id="syncDetail">正在读取连接状态…</div>
      </form>
    </div>
  </section>
</div>

<div class="group-modal" id="groupModal" aria-hidden="true">
  <section class="group-card" role="dialog" aria-modal="true" aria-labelledby="groupTitle">
    <header class="group-head">
      <div><h2 id="groupTitle">对话分组</h2><p id="groupHint">先选择一个对话，即可把它移入分组</p></div>
      <span class="sp"></span><button class="group-close" id="groupClose" type="button" aria-label="关闭">×</button>
    </header>
    <div class="group-body">
      <section class="group-section">
        <label class="group-label" for="groupAssignment">当前对话归属</label>
        <div class="group-assignment"><select id="groupAssignment" disabled><option value="">未分组</option></select></div>
      </section>
      <section class="group-section">
        <span class="group-label">管理分组</span>
        <div class="group-rows" id="groupRows"></div>
        <form class="group-new" id="groupNew"><input id="groupNewName" maxlength="24" placeholder="输入新分组名称"><button type="submit">新建</button></form>
        <div class="group-error" id="groupError"></div>
      </section>
    </div>
  </section>
</div>

<div id="frameWrap">
  <div class="loadmask" id="loadMask">正在加载网站…</div>
  <!-- 走同源反代:路径相对本页(/api/plugins/mx2025_viewer/page) -->
  <iframe id="frame" title="MX技术小筑"></iframe>
</div>

<script>
(function(){
  var fr=document.getElementById('frame');
  var mask=document.getElementById('loadMask');
  var toggle=document.getElementById('inactiveToggle');
  var groupFilter=document.getElementById('groupFilter');
  var groupManage=document.getElementById('groupManage');
  var groupModal=document.getElementById('groupModal');
  var groupClose=document.getElementById('groupClose');
  var groupAssignment=document.getElementById('groupAssignment');
  var groupRows=document.getElementById('groupRows');
  var groupNew=document.getElementById('groupNew');
  var groupNewName=document.getElementById('groupNewName');
  var groupHint=document.getElementById('groupHint');
  var groupError=document.getElementById('groupError');
  var syncStatus=document.getElementById('syncStatus');
  var syncManage=document.getElementById('syncManage');
  var syncModal=document.getElementById('syncModal');
  var syncClose=document.getElementById('syncClose');
  var syncForm=document.getElementById('syncForm');
  var syncCloudUrl=document.getElementById('syncCloudUrl');
  var syncPairingCode=document.getElementById('syncPairingCode');
  var syncDeviceName=document.getElementById('syncDeviceName');
  var syncNow=document.getElementById('syncNow');
  var syncDisconnect=document.getElementById('syncDisconnect');
  var syncError=document.getElementById('syncError');
  var syncDetail=document.getElementById('syncDetail');
  var groupState={groups:[],assignments:{}};
  var selectedRoom={id:'',title:''};
  var groupApi='__MX_GROUP_API__';
  var viewerMode='__MX_VIEWER_MODE__';
  var inactiveDays=Number('__MX_INACTIVE_DAYS__') || 30;
  var showInactive=false;
  var filterRetry=0;
  var preloadingRooms=false;
  var preloadPromise=null;
  var cleanup=function(){};
  var captureBusy=false;
  var lastCaptureAt=0;
  if(viewerMode==='bridge'){
    syncStatus.textContent='云端会话';
    syncManage.hidden=true;
  }
  function requestJson(path,options){
    var settings=Object.assign({headers:{'Content-Type':'application/json'}},options || {});
    return fetch(groupApi+path,settings).then(function(response){
      return response.json().catch(function(){ return {}; }).then(function(payload){
        if(!response.ok) throw new Error(payload.detail || '操作失败');
        return payload;
      });
    });
  }
  function setGroupError(message){ groupError.textContent=message || ''; }
  function refreshGroupFilter(){
    var current=groupFilter.value || 'all';
    groupFilter.replaceChildren();
    [['all','全部对话'],['ungrouped','未分组']].forEach(function(pair){
      var option=document.createElement('option'); option.value=pair[0]; option.textContent=pair[1]; groupFilter.appendChild(option);
    });
    groupState.groups.forEach(function(group){
      var option=document.createElement('option'); option.value=group.id; option.textContent=group.name; groupFilter.appendChild(option);
    });
    groupFilter.value=Array.from(groupFilter.options).some(function(item){return item.value===current;}) ? current : 'all';
  }
  function applyGroupFilter(doc){
    if(!doc) return;
    var active=groupFilter.value || 'all';
    doc.querySelectorAll('.cu-list.menu-avatar .cu-item[id^="room"]').forEach(function(item){
      var roomId=item.id.slice(4);
      var assigned=groupState.assignments[roomId] || '';
      var assignedGroup=groupState.groups.find(function(group){return group.id===assigned;});
      var hiddenServiceGroup=assignedGroup && /（隐藏）$/.test(assignedGroup.name || '');
      var visible=preloadingRooms || (hiddenServiceGroup
        ? active===assigned
        : active==='all' || (active==='ungrouped' ? !assigned : assigned===active));
      item.setAttribute('data-mx-group-hidden',visible ? '0' : '1');
      if(item.getAttribute('data-mx-group-bound')!=='1'){
        item.setAttribute('data-mx-group-bound','1');
        item.addEventListener('click',function(){
          doc.querySelectorAll('.cu-list.menu-avatar .cu-item.mx-current-room').forEach(function(room){room.classList.remove('mx-current-room');});
          item.classList.add('mx-current-room');
          selectedRoom.id=roomId;
          var title=item.querySelector('.text-black.text-bold');
          selectedRoom.title=(title && title.textContent || '当前对话').trim();
          groupManage.textContent='整理当前对话';
        },true);
      }
    });
  }
  function hideFinishedRoomLoader(doc){
    var list=doc && doc.querySelector('.cu-list.menu-avatar');
    var scope=list && list.parentElement;
    if(!scope) return;
    scope.querySelectorAll('*').forEach(function(node){
      if(node.children.length===0 && /^\s*加载中\.\.\.\s*$/.test(node.textContent || '')){
        node.style.setProperty('display','none','important');
        node.setAttribute('data-mx-room-loader-finished','1');
      }
    });
  }
  function hideUpstreamPromotionModals(doc){
    if(!doc) return;
    doc.querySelectorAll('.cu-modal').forEach(function(modal){
      var dialog=modal.querySelector('.cu-dialog');
      var text=String(dialog && dialog.textContent || '').replace(/\s+/g,'');
      var isDailyCheckin=/(?:每日签到|签到有惊喜)/.test(text) &&
        /(?:扫码下载APP|前往APP签到|APP签到|每天需要签到使用)/i.test(text);
      modal.setAttribute('data-mx-promotion-hidden',isDailyCheckin ? '1' : '0');
    });
  }
  function stableHash(value){
    var hash=2166136261;
    var text=String(value || '');
    for(var index=0;index<text.length;index+=1){
      hash^=text.charCodeAt(index);
      hash=Math.imul(hash,16777619);
    }
    return (hash>>>0).toString(16).padStart(8,'0');
  }
  function refreshSyncStatus(){
    if(viewerMode==='bridge'){
      fetch(groupApi+'/capture/status',{headers:{'Accept':'application/json'}})
        .then(function(response){return response.ok ? response.json() : Promise.reject(new Error('status'));})
        .then(function(payload){
          if(!syncStatus) return;
          syncStatus.textContent=payload.last_capture_at ? '云端采集中' : '云端会话';
        }).catch(function(){ if(syncStatus) syncStatus.textContent='云端会话'; });
      return;
    }
    fetch(groupApi+'/sync/status',{headers:{'Accept':'application/json'}})
      .then(function(response){return response.ok ? response.json() : Promise.reject(new Error('status'));})
      .then(function(payload){
        if(!syncStatus) return;
        if(payload.configured){
          syncStatus.textContent=payload.pending ? '云端待同步 '+payload.pending+' 条' : '云端已同步';
        }else{
          syncStatus.textContent=payload.pending ? '本地已采集 '+payload.pending+' 条' : '本地采集中';
        }
        if(syncDetail){
          syncDetail.textContent=payload.configured
            ? '已连接 '+payload.device_name+' · 待同步 '+payload.pending+' 条'+(payload.last_error ? ' · '+payload.last_error : '')
            : '尚未连接云端，本地已安全排队 '+payload.pending+' 条消息。';
          if(payload.configured){
            syncCloudUrl.value=payload.cloud_url || '';
            syncDeviceName.value=payload.device_name || 'Echo Desktop';
          }
        }
      }).catch(function(){ if(syncStatus) syncStatus.textContent='本地采集中'; });
  }
  function captureVisibleMessages(doc){
    var now=Date.now();
    if(captureBusy || now-lastCaptureAt<15000) return;
    lastCaptureAt=now;
    var messages=[];
    doc.querySelectorAll('.cu-list.menu-avatar .cu-item[id^="room"]').forEach(function(item){
      var roomId=item.id.slice(4);
      var titleNode=item.querySelector('.text-black.text-bold');
      var title=String(titleNode && titleNode.textContent || '').trim();
      var timeNode=item.querySelector('.text-grey.text-xs');
      var activeAt=String(timeNode && timeNode.textContent || '').trim();
      var previewNodes=item.querySelectorAll('.text-gray,.text-grey');
      var preview='';
      previewNodes.forEach(function(node){
        var candidate=String(node.textContent || '').trim();
        if(candidate && candidate!==activeAt && candidate!==title && candidate.length>preview.length) preview=candidate;
      });
      if(!roomId || !title || !preview) return;
      messages.push({
        source:'mx2025',source_room_id:roomId,
        source_message_id:'summary:'+stableHash(roomId+'\n'+activeAt+'\n'+preview),
        title:title,content:preview,published_at:activeAt || null,
        payload:{kind:'room_summary'}
      });
    });
    var current=doc.querySelector('.cu-list.menu-avatar .cu-item.mx-current-room') ||
      doc.querySelector('.cu-list.menu-avatar .cu-item[style*="#e2e2e2"]');
    var currentRoomId=current && current.id && current.id.indexOf('room')===0 ? current.id.slice(4) : selectedRoom.id;
    var currentTitleNode=current && current.querySelector('.text-black.text-bold');
    var currentTitle=String(currentTitleNode && currentTitleNode.textContent || selectedRoom.title || '').trim();
    if(currentRoomId){
      doc.querySelectorAll('.content .cu-card').forEach(function(card){
        var body=card.querySelector('.phone_message');
        var content=String(body && body.textContent || '').trim();
        if(!content) return;
        var cardText=String(card.textContent || '');
        var dateMatch=cardText.match(/20\d{2}[-\/]\d{1,2}[-\/]\d{1,2}\s+\d{1,2}:\d{2}:\d{2}/);
        var publishedAt=dateMatch ? dateMatch[0] : null;
        messages.push({
          source:'mx2025',source_room_id:currentRoomId,
          source_message_id:'message:'+stableHash(currentRoomId+'\n'+(publishedAt || '')+'\n'+content),
          title:currentTitle,content:content,published_at:publishedAt,
          payload:{kind:'conversation_message'}
        });
      });
    }
    if(!messages.length){ refreshSyncStatus(); return; }
    captureBusy=true;
    var captureHeaders={'Content-Type':'application/json'};
    if(viewerMode==='bridge') captureHeaders['X-Echo-Viewer']='1';
    fetch(groupApi+(viewerMode==='bridge' ? '/capture' : '/sync/capture'),{
      method:'POST',headers:captureHeaders,
      body:JSON.stringify({messages:messages.slice(0,100)})
    }).then(function(){refreshSyncStatus();}).catch(function(){
      if(syncStatus) syncStatus.textContent='本地采集暂不可用';
    }).finally(function(){captureBusy=false;});
  }
  window.__echoMxCapture=function(){
    lastCaptureAt=0;
    try{ captureVisibleMessages(fr.contentDocument); }catch(_error){}
  };
  function ensureAllRoomsLoaded(doc){
    if(!doc || (groupFilter.value || 'all')==='all') return Promise.resolve();
    if(preloadPromise) return preloadPromise;
    var target=Object.keys(groupState.assignments || {}).length;
    var current=doc.querySelectorAll('.cu-list.menu-avatar .cu-item[id^="room"]').length;
    if(!target || current>=target){
      hideFinishedRoomLoader(doc);
      return Promise.resolve();
    }
    preloadingRooms=true;
    groupFilter.disabled=true;
    groupManage.textContent='正在加载完整分组…';
    applyGroupFilter(doc);
    preloadPromise=new Promise(function(resolve){
      var stable=0;
      var previous=current;
      function finish(){
        preloadingRooms=false;
        preloadPromise=null;
        groupFilter.disabled=false;
        groupManage.textContent=selectedRoom.id ? '整理当前对话' : '分组管理';
        applyGroupFilter(doc);
        hideFinishedRoomLoader(doc);
        var first=doc.querySelector('.cu-list.menu-avatar .cu-item[id^="room"]:not([data-mx-group-hidden="1"]):not([data-mx-inactive-hidden="1"]):not([data-mx-empty-hidden="1"])');
        if(first) first.scrollIntoView({block:'start'});
        resolve();
      }
      function advance(){
        var items=doc.querySelectorAll('.cu-list.menu-avatar .cu-item[id^="room"]');
        var count=items.length;
        if(count>=target || stable>=8){ finish(); return; }
        stable=count===previous ? stable+1 : 0;
        previous=count;
        var last=items[count-1];
        if(last) last.scrollIntoView({block:'end'});
        doc.defaultView.setTimeout(advance,450);
      }
      advance();
    });
    return preloadPromise;
  }
  function renderGroupManager(){
    groupHint.textContent=selectedRoom.id ? selectedRoom.title : '先选择一个对话，即可把它移入分组';
    groupAssignment.disabled=!selectedRoom.id;
    groupAssignment.replaceChildren();
    var none=document.createElement('option'); none.value=''; none.textContent='未分组'; groupAssignment.appendChild(none);
    groupState.groups.forEach(function(group){
      var option=document.createElement('option'); option.value=group.id; option.textContent=group.name; groupAssignment.appendChild(option);
    });
    groupAssignment.value=selectedRoom.id ? (groupState.assignments[selectedRoom.id] || '') : '';
    groupRows.replaceChildren();
    if(!groupState.groups.length){
      var empty=document.createElement('div'); empty.className='group-empty'; empty.textContent='还没有分组，在下方新建一个。'; groupRows.appendChild(empty);
    }
    groupState.groups.forEach(function(group){
      var row=document.createElement('div'); row.className='group-row';
      var input=document.createElement('input'); input.value=group.name; input.maxLength=24; input.setAttribute('aria-label','分组名称');
      var save=document.createElement('button'); save.type='button'; save.textContent='保存';
      var remove=document.createElement('button'); remove.type='button'; remove.textContent='删除'; remove.className='danger';
      save.addEventListener('click',function(){
        setGroupError(''); requestJson('/groups/'+encodeURIComponent(group.id),{method:'PATCH',body:JSON.stringify({name:input.value})})
          .then(loadGroups).catch(function(error){setGroupError(error.message);});
      });
      remove.addEventListener('click',function(){
        if(!confirm('删除“'+group.name+'”？其中的对话会回到未分组。')) return;
        setGroupError(''); requestJson('/groups/'+encodeURIComponent(group.id),{method:'DELETE'})
          .then(loadGroups).catch(function(error){setGroupError(error.message);});
      });
      row.append(input,save,remove); groupRows.appendChild(row);
    });
  }
  function loadGroups(){
    return requestJson('/groups').then(function(payload){
      groupState.groups=Array.isArray(payload.groups) ? payload.groups : [];
      groupState.assignments=payload.assignments || {};
      refreshGroupFilter(); renderGroupManager();
      try{ applyGroupFilter(fr.contentDocument); }catch(_err){}
    });
  }
  function openGroupModal(){ setGroupError(''); renderGroupManager(); groupModal.classList.add('show'); groupModal.setAttribute('aria-hidden','false'); }
  function closeGroupModal(){ groupModal.classList.remove('show'); groupModal.setAttribute('aria-hidden','true'); }
  groupManage.addEventListener('click',openGroupModal);
  groupClose.addEventListener('click',closeGroupModal);

  function hasVisibleText(value){

  function parseLastActive(text, now){
    var value=String(text || '').trim();
    if(!value) return null;
    var short=value.match(/^(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?$/);
    if(short){
      var month=Number(short[1]);
      var day=Number(short[2]);
      var year=now.getFullYear();
      var date=new Date(year,month-1,day,Number(short[3] || 23),Number(short[4] || 59),59);
      // The list omits the year. A future-looking month/day belongs to last year.
      if(date.getTime()>now.getTime()+24*60*60*1000){
        date.setFullYear(year-1);
      }
      return isNaN(date.getTime()) ? null : date;
    }
    var full=value.match(/^(\d{4})[-\/]([01]?\d)[-\/]([0-3]?\d)(?:\s+(\d{1,2}):(\d{2}))?/);
    if(full){
      var parsed=new Date(Number(full[1]),Number(full[2])-1,Number(full[3]),Number(full[4] || 23),Number(full[5] || 59),59);
      return isNaN(parsed.getTime()) ? null : parsed;
    }
    if(/刚刚|分钟前|小时前|今天/.test(value)) return new Date(now.getTime());
    if(/昨天/.test(value)) return new Date(now.getTime()-24*60*60*1000);
    if(/前天/.test(value)) return new Date(now.getTime()-2*24*60*60*1000);
    return null;
  }

    var scheduled=false;
    var stopped=false;
    function renderToggle(hidden){
      toggle.hidden=hidden===0;
      toggle.textContent=(showInactive ? '收起旧对话 · ' : '已收起 ')+hidden+' 个';
      toggle.classList.toggle('active',showInactive);
    }
    function scan(){
      scheduled=false;
      if(stopped) return;
      var now=new Date();
      var cutoff=now.getTime()-inactiveDays*24*60*60*1000;
      var items=doc.querySelectorAll('.cu-list.menu-avatar .cu-item');
      var hidden=0;
      hideUpstreamPromotionModals(doc);
      doc.querySelectorAll('.cu-bar .action').forEach(function(action){
        if(/^\s*直播间列表/.test(action.textContent || '')) action.textContent='对话';
      });
      items.forEach(function(item){
        var titleNode=item.querySelector('.text-black.text-bold');
        var empty=Boolean(item.id && item.id.indexOf('room')===0 && !hasVisibleText(titleNode && titleNode.textContent));
        item.setAttribute('data-mx-empty-hidden',empty ? '1' : '0');
        var timeNode=item.querySelector('.text-grey.text-xs');
        var lastActive=parseLastActive(timeNode && timeNode.textContent,now);
        var inactive=Boolean(lastActive && lastActive.getTime()<cutoff);
        if(inactive) hidden+=1;
        var next=inactive ? '1' : '0';
        if(item.getAttribute('data-mx-inactive-hidden')!==next){
          item.setAttribute('data-mx-inactive-hidden',next);
        }
      });
      doc.querySelectorAll('.phone_message').forEach(function(card){
        card.setAttribute('data-mx-empty-hidden',hasVisibleText(card.textContent) ? '0' : '1');
      });
      doc.querySelectorAll('.mx-text span').forEach(function(node){
        if(node.childElementCount) return;
        var source=node.textContent || '';
        if(source===node.getAttribute('data-mx-formatted-value')) return;
        var formatted=source
          .replace(/^\s*#{1,6}\s+/gm,'')
          .replace(/^\s*>\s?/gm,'')
          .replace(/\n{3,}/g,'\n\n');
        if(formatted!==source) node.textContent=formatted;
        node.setAttribute('data-mx-formatted-value',formatted);
      });
      renderToggle(hidden);
      applyGroupFilter(doc);
      captureVisibleMessages(doc);
    }
    function schedule(){
      if(scheduled || stopped) return;
      scheduled=true;
      win.requestAnimationFrame(scan);
    }
    var observer=new win.MutationObserver(schedule);
    try{
      observer.observe(doc.documentElement,{subtree:true,childList:true,characterData:true});
    }catch(_err){
      observer.disconnect();
      if(filterRetry<10){
        filterRetry+=1;
        win.setTimeout(installFilter,200);
      }
      return;
    }
    filterRetry=0;
    var timer=win.setInterval(scan,15000);
    doc.documentElement.classList.toggle('mx-show-inactive',showInactive);
    scan();
    cleanup=function(){
      stopped=true;
      observer.disconnect();
      win.clearInterval(timer);
    };

        cleanup();
        fr.src=proxyPath+'?echo_proxy=7#/';
        return;
      }
    }catch(_err){}
    recoveringRootNavigation=false;
    installFilter();
  });
